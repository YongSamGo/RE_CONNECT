# 다시잇다 릴리스 — 운영 이미지 빌드·검사·SBOM·ECR 게시와 릴리스 manifest (#93 W12-04).
#
# - PR: 이미지·배포 파일이 바뀌면 backend·frontend 이미지를 빌드하고 Trivy 판정만 한다 (게시 없음).
#   음성 이미지는 무거워서 음성 빌드 파일·판정 도구가 바뀐 PR과 릴리스 태그에서만 빌드·검사한다.
# - main의 v* 태그: release 환경 승인 뒤 세 이미지를 빌드·검사하고 ECR에 올린다.
#   빌드 출처 증명(provenance)을 붙이고, manifest와 SBOM을 초안 GitHub Release에 첨부한다.
# - EC2 반영은 이 워크플로가 하지 않는다. 운영자가 manifest의 digest로 직접 배포한다 (infra/deploy/README.md).
#
# 저장소 설정(admin)이 필요하다: release 환경(필수 승인자·v* 태그만 허용),
# 환경 변수 AWS_REGION, 환경 시크릿 AWS_ACCOUNT_ID·AWS_RELEASE_ROLE_ARN·ECR_REGISTRY. 장기 AWS 키는 두지 않고 OIDC 역할만 쓴다.
# 공개 저장소라 로그·증명·Release가 모두 공개된다. AWS 계정 ID는 시크릿으로 가리고, 빌드 출처 증명과
# manifest에는 레지스트리 주소 없이 저장소 이름과 digest만 남긴다 (Sigstore 공개 로그는 지울 수 없다).
# ci.yml과 같은 원칙: 액션 SHA 고정, 잡별 최소 권한, persist-credentials: false, 캐시 미사용, ${{ }}는 env로 전달.

name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "backend/Dockerfile"
      - "backend/.dockerignore"
      - "backend/requirements.txt"
      - "frontend/Dockerfile"
      - "frontend/.dockerignore"
      - "frontend/package-lock.json"
      - "speech/Dockerfile"
      - "speech/.dockerignore"
      - "speech/requirements*.txt"
      - "speech/tts_compat/**"
      - "infra/compose.prod.yaml"
      - "infra/deploy/**"
      - "infra/release/**"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  TRIVY_VERSION: "0.75.0"
  TRIVY_SHA256: "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f"

jobs:
  tools:
    name: 배포 도구 시험·Compose 구성 확인
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 릴리스·배포 도구 시험 (정상 입력 + 공격 입력)
        run: |
          python -I -m unittest discover -s infra/release/tests
          python -I -m unittest discover -s infra/deploy/tests
      - name: 운영 Compose 구성 확인 (가짜 값)
        run: |
          dir="$RUNNER_TEMP/compose"
          mkdir -m 700 "$dir"
          digest="sha256:$(printf 'b%.0s' $(seq 64))"
          printf 'DATABASE_URL=x\n' > "$dir/app.env"
          printf 'REDIS_PASSWORD=%s\n' "$(printf 'a%.0s' $(seq 32))" > "$dir/redis.env"
          cp "$dir/app.env" "$dir/migrate.env"
          {
            echo "BACKEND_IMAGE=registry.example/reconnect-backend@$digest"
            echo "FRONTEND_IMAGE=registry.example/reconnect-frontend@$digest"
            echo "AWS_REGION=ap-northeast-2"
            echo "DEPLOY_ENV=staging"
            echo "APP_ENV_FILE=$dir/app.env"
            echo "REDIS_ENV_FILE=$dir/redis.env"
            echo "MIGRATE_ENV_FILE=$dir/migrate.env"
          } > "$dir/images.env"
          docker compose --env-file "$dir/images.env" -f infra/compose.prod.yaml --profile migrate config --quiet

  image-check:
    name: 이미지 빌드·검사
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy 설치 (SHA-256 체크섬 검증)
        run: |
          url="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/trivy.tar.gz" "$url"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
      - name: 빌드·검사·판정
        env:
          IMAGE: ${{ matrix.image }}
        run: TRIVY="$RUNNER_TEMP/trivy" infra/release/build_and_scan.sh "$IMAGE" "$RUNNER_TEMP/out"

  speech-image-check:
    # 음성 이미지는 무거워서 음성 빌드 파일이나 판정 도구가 바뀐 PR에서만 빌드한다.
    # 그래야 빌드 문제를 release 환경 승인 뒤 첫 태그에서야 알게 되는 일을 막는다.
    name: 이미지 빌드·검사 (speech)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # PR 병합 커밋의 첫 부모(base)와 비교한다
          persist-credentials: false
      - name: 음성 빌드 파일 변경 확인
        id: changed
        run: |
          if git diff --quiet HEAD^1 HEAD -- speech/Dockerfile speech/.dockerignore 'speech/requirements*.txt' \
              speech/tts_compat .github/workflows/release.yml infra/release; then
            echo "speech=false" >> "$GITHUB_OUTPUT"
            echo "음성 빌드 파일 변경 없음. 빌드를 건너뛴다."
          else
            echo "speech=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Trivy 설치 (SHA-256 체크섬 검증)
        if: steps.changed.outputs.speech == 'true'
        run: |
          url="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/trivy.tar.gz" "$url"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
      - name: 빌드·검사·판정
        if: steps.changed.outputs.speech == 'true'
        run: TRIVY="$RUNNER_TEMP/trivy" infra/release/build_and_scan.sh speech "$RUNNER_TEMP/out"

  publish:
    name: 릴리스 이미지 게시
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: tools
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write # 초안 GitHub Release 생성
      id-token: write # AWS OIDC 역할·빌드 출처 증명 서명
      attestations: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: AWS 계정 ID 가리기
        # 공개 로그에 계정 ID가 어떤 형태(ARN·레지스트리 주소)로 나와도 ***로 보이게 먼저 등록한다.
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]] || { echo "::error::release 환경 시크릿 AWS_ACCOUNT_ID(12자리)가 필요합니다"; exit 1; }
          echo "::add-mask::$AWS_ACCOUNT_ID"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # 태그 커밋이 main 이력에 있는지 확인한다
          persist-credentials: false
      - name: 태그 형식과 main에 머지된 커밋인지 확인
        # 형식 검사는 release_manifest.py의 TAG와 같다. 게시 전에 멈춰 Release 없는 이미지가 남지 않게 한다.
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || { echo "::error::태그는 vMAJOR.MINOR.PATCH(-rc.N) 형식이어야 합니다"; exit 1; }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Trivy 설치 (SHA-256 체크섬 검증)
        run: |
          url="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/trivy.tar.gz" "$url"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
      - name: 세 이미지 빌드·검사·판정
        run: |
          for image in backend frontend speech; do
            TRIVY="$RUNNER_TEMP/trivy" infra/release/build_and_scan.sh "$image" "$RUNNER_TEMP/out"
          done
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: reconnect-release
          mask-aws-account-id: true
      - name: ECR 게시와 digest 기록
        id: push
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          for image in backend frontend speech; do
            repo="$ECR_REGISTRY/reconnect-$image"
            docker tag "reconnect-$image:candidate" "$repo:$RELEASE_TAG"
            docker push --quiet "$repo:$RELEASE_TAG"
            ref="$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$repo:$RELEASE_TAG" | grep -m1 "^$repo@sha256:")"
            digest="${ref#*@}"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::$image digest를 읽지 못했습니다"; exit 1; }
            # 이후 단계·manifest·증명에는 레지스트리 주소(계정 ID) 없이 저장소 이름과 digest만 넘긴다.
            echo "${image}_ref=reconnect-$image@$digest" >> "$GITHUB_OUTPUT"
            echo "${image}_digest=$digest" >> "$GITHUB_OUTPUT"
          done
      - name: ECR 로그아웃
        # 앞 단계가 실패해도 러너에 레지스트리 자격 증명을 남기지 않는다.
        if: always()
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
        run: docker logout "$ECR_REGISTRY" || true
      # 공개 저장소의 증명은 Sigstore 공개 로그(Rekor)에 영구히 남는다. 대상 이름에 레지스트리 주소를 넣지 않고,
      # 증명을 ECR에 다시 올리지도 않는다(push-to-registry는 대상 이름이 실제 레지스트리여야 한다).
      # 검증은 digest로 한다: gh attestation verify oci://<ECR>/reconnect-<이름>@<digest> (infra/deploy/README.md 6절).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: reconnect-backend
          subject-digest: ${{ steps.push.outputs.backend_digest }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: reconnect-frontend
          subject-digest: ${{ steps.push.outputs.frontend_digest }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: reconnect-speech
          subject-digest: ${{ steps.push.outputs.speech_digest }}
      - name: 릴리스 manifest 생성과 초안 Release 첨부
        env:
          BACKEND_REF: ${{ steps.push.outputs.backend_ref }}
          FRONTEND_REF: ${{ steps.push.outputs.frontend_ref }}
          SPEECH_REF: ${{ steps.push.outputs.speech_ref }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          out="$RUNNER_TEMP/out"
          python3 -I infra/release/release_manifest.py build \
            --tag "$RELEASE_TAG" --commit "$GITHUB_SHA" \
            --image "backend=$BACKEND_REF" --image "frontend=$FRONTEND_REF" --image "speech=$SPEECH_REF" \
            --sbom "backend=$out/backend-sbom.cdx.json" --sbom "frontend=$out/frontend-sbom.cdx.json" \
            --sbom "speech=$out/speech-sbom.cdx.json" \
            --output "$out/release-manifest.json"
          # 검사 결과(*-scan.json)는 미조치 취약점 목록이라 첨부하지 않는다. manifest와 SBOM만 올린다.
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" \
            --notes "운영 이미지 digest와 버전 기록: release-manifest.json. 배포는 infra/deploy/README.md를 따른다." \
            "$out/release-manifest.json" "$out/backend-sbom.cdx.json" \
            "$out/frontend-sbom.cdx.json" "$out/speech-sbom.cdx.json"
