# 다시잇다 CI — 모든 PR과 main·develop push에 보안 점검을 자동으로 건다.
#
# 브랜치 보호의 필수 체크는 맨 아래 `CI 통과` 하나만 지정한다.
# (아직 없는 backend/frontend 점검은 Skipped로 넘어가고, 폴더가 생기면 자동으로 켜진다.)
#
# 워크플로 자체 보안 원칙
# - 외부 액션은 태그가 아니라 커밋 SHA로 고정 (태그 변조·공급망 공격 방지)
# - 토큰 권한은 기본 없음, 잡마다 필요한 최소 권한만 부여
# - checkout 후 토큰을 git 설정에 남기지 않음 (persist-credentials: false)
# - `${{ }}` 값을 run 스크립트에 직접 넣지 않고 env로 전달 (스크립트 삽입 방지)
# - pull_request_target 미사용, 의존성 캐시 미사용 (캐시 오염 방지)

name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    # 코드 변경이 없어도 새로 공개된 취약점(CVE)을 잡기 위해 매주 월요일 09:00 KST 재검사.
    # schedule은 기본 브랜치(develop)에서만 돌기 때문에, 아래 weekly-main 잡이 main에도 CI·CodeQL을 실행시킨다.
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"
  BANDIT_VERSION: "1.9.4"
  PIP_AUDIT_VERSION: "2.10.1"
  ZIZMOR_VERSION: "1.30.1"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  detect:
    name: 점검 대상 확인
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      python_projects: ${{ steps.scan.outputs.python_projects }}
      frontend: ${{ steps.scan.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: scan
        name: 존재하는 프로젝트 찾기
        run: |
          projects=""
          for dir in backend worker; do
            if [ -f "$dir/requirements.txt" ]; then
              projects="${projects:+$projects,}\"$dir\""
            fi
          done
          echo "python_projects=[$projects]" >> "$GITHUB_OUTPUT"

          if [ -f frontend/package-lock.json ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  secrets:
    name: 비밀값 유출 점검 (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # 지워진 커밋 속 비밀값까지 찾도록 이력 전체를 받는다
          persist-credentials: false
      - name: gitleaks 설치 (SHA-256 체크섬 검증)
        run: |
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "$url"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: 커밋 이력 전체 검사
        # --redact: 공개 레포라 로그에 비밀값 원문이 찍히지 않게 가린다
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner --exit-code 1 .

  workflow-audit:
    name: 워크플로 보안 점검 (zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: zizmor 설치
        run: python -m pip install "zizmor==${ZIZMOR_VERSION}"
      - name: 워크플로·dependabot 설정 검사
        # 권한 과다, 스크립트 삽입, 고정되지 않은 액션, 위장 커밋(impostor commit) 등을 찾는다
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --min-severity low .

  hidden-text:
    name: 숨은 문자·지시문 점검
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # PR 병합 커밋의 첫 부모(base)와 비교해 새로 추가된 줄을 찾는다
          persist-credentials: false
      - name: 검사 스크립트 회귀 시험
        run: python3 -I .github/scripts/test_check_hidden_text.py
      - name: 숨은 문자(실패)·에이전트 지시 파일 의심 문구(경고) 검사
        # AI 개발 도구가 읽는 보이지 않는 문자(폭 없는 문자·글자 방향 제어·태그 문자 등)를 막는다.
        # 기준: .claude/skills/kisa-secure-coding-python/references/llm-security.md AGT-01·AGT-03
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python3 -I .github/scripts/check_hidden_text.py --diff-base HEAD^1
          else
            python3 -I .github/scripts/check_hidden_text.py
          fi

  python:
    # 매트릭스 값은 이름 뒤에 자동으로 붙는다 (예: "Python 점검 (backend)")
    name: Python 점검
    needs: detect
    if: needs.detect.outputs.python_projects != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.detect.outputs.python_projects) }}
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 의존성·점검 도구 설치
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install "bandit==${BANDIT_VERSION}" "pip-audit==${PIP_AUDIT_VERSION}"
      - name: 테스트 (pytest — 정상 입력 + 공격 시나리오)
        run: python -m pytest
      - name: 코드 보안약점 점검 (bandit)
        # 심각도는 낮음(low)부터 모두 실패로 처리하고, 오탐이 많은 낮은 신뢰도는 제외한다.
        # 예외가 필요하면 해당 줄에 `# nosec B000 - 사유` 를 적고 PR 리뷰에서 승인받는다.
        run: |
          bandit -r . \
            --exclude ./tests,./.venv \
            --severity-level low \
            --confidence-level medium
      - name: 의존성 취약점 점검 (pip-audit)
        run: pip-audit -r requirements.txt --strict --progress-spinner off

  persistence:
    name: PostgreSQL Redis 통합
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # 이 잡에서만 쓰고 폐기하는 가상 개발 자격증명이다. 운영에 재사용하지 않는다.
      POSTGRES_DB: reconnect_ci
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      REDIS_PASSWORD: "00000000000000000000000000000000"
      PERSISTENCE_TEST_DATABASE_URL: postgresql+psycopg://test:test@127.0.0.1:5432/reconnect_ci
      PERSISTENCE_TEST_REDIS_URL: redis://:00000000000000000000000000000000@127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 해시 고정 의존성 설치
        working-directory: backend
        run: python -m pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: Compose 구성 확인과 실제 개발 DB Redis 실행
        run: |
          docker compose --env-file .env.example -f infra/compose.dev.yaml config --quiet
          docker compose --env-file .env.example -f infra/compose.dev.yaml up -d --wait --wait-timeout 90
          python infra/check_dev_services.py
      - name: 빈 DB 마이그레이션과 정상 조회
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://test:test@127.0.0.1:5432/reconnect_ci
        run: |
          python -m alembic upgrade head
          python -m alembic check
      - name: PostgreSQL 실제 제약과 마이그레이션 Redis 비영속화 시험
        working-directory: backend
        run: python -m pytest tests/test_member_models.py tests/test_operational_models.py tests/test_migrations.py tests/test_persistence_connections.py -q
      - name: 실제 Redis 세션 수명과 원자 교체 시험
        working-directory: backend
        run: python -m pytest tests/test_sessions.py tests/test_kakao_state.py tests/test_auth_accounts.py tests/test_member_auth.py -q
      - name: 실제 PostgreSQL 공개 공고 검색 시험
        working-directory: backend
        run: python -m pytest tests/test_public_opportunities.py -q
      - name: 실제 PostgreSQL 수집 버전과 동시 수집 시험
        working-directory: backend
        run: python -m pytest tests/test_ingestion_versions.py -q
      - name: 개발 컨테이너 종료
        if: always()
        run: docker compose --env-file .env.example -f infra/compose.dev.yaml down

  frontend:
    name: 프론트엔드 점검
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: 의존성 설치 (설치 스크립트 실행 차단)
        # 악성 패키지의 postinstall 스크립트가 CI에서 실행되는 것을 막는다
        run: npm ci --ignore-scripts
      - name: 패키지 서명·출처 검증
        run: npm audit signatures
      - name: 의존성 취약점 점검 (운영 의존성, 높음 이상)
        run: npm audit --omit=dev --audit-level=high
      - name: 린트
        run: npm run lint
      - name: 테스트
        run: npm test --if-present
      - name: 빌드 (타입 검사 포함)
        run: npm run build

  dependency-review:
    name: 새 의존성 검토
    needs: detect
    # 의존성 파일이 생긴 뒤에만 실행한다. 저장소 설정의 Dependency graph가 켜져 있어야 한다.
    if: >-
      github.event_name == 'pull_request' &&
      (needs.detect.outputs.python_projects != '[]' || needs.detect.outputs.frontend == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # PR에서 새로 추가·변경되는 패키지에 중간(moderate) 이상 취약점이 있으면 실패
          fail-on-severity: moderate
          comment-summary-in-pr: never

  weekly-main:
    name: main 주간 재검사 요청
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write # main 브랜치에서 워크플로를 실행(workflow_dispatch)하기 위해 필요
    steps:
      - name: main에서 CI·CodeQL 실행
        # 제출·시연용 main도 새 CVE로 재검사한다. main의 워크플로 파일 기준으로 돈다.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run ci.yml --ref main
          gh workflow run codeql.yml --ref main

  ci-ok:
    name: CI 통과
    if: always()
    needs: [detect, secrets, workflow-audit, hidden-text, python, persistence, frontend, dependency-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: 결과 판정
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e 'to_entries | any(.value.result == "failure" or .value.result == "cancelled")' > /dev/null; then
            echo "::error::실패하거나 취소된 점검이 있습니다. 위 결과에서 failure/cancelled 항목을 확인하세요."
            exit 1
          fi
