# Dependabot — 의존성 업데이트 PR을 자동으로 만든다.
# 새로 나온 버전은 7일 기다린 뒤 올린다 (배포 직후 악성 버전이 섞이는 공급망 공격 대비).

version: 2
updates:
  # AWS 회귀 시험의 추가 의존성도 같은 7일 대기 기준으로 갱신한다.
  - package-ecosystem: pip
    directory: /infra/aws
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    cooldown:
      default-days: 7
    commit-message:
      prefix: "sec"

  # CI 액션 (커밋 SHA 고정값과 버전 주석을 함께 갱신)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "sec"

  # backend Python 의존성 (requirements*.in → 해시 포함 requirements*.txt)
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    cooldown:
      default-days: 7
    commit-message:
      prefix: "sec"

  - package-ecosystem: pip
    directory: /speech
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    cooldown:
      default-days: 7
    # httpx2는 httpcore2의 같은 버전을 정확히 요구하므로 함께 갱신한다.
    groups:
      http-client:
        patterns: ["httpx2", "httpcore2"]
    commit-message:
      prefix: "sec"

  - package-ecosystem: pip
    directory: /speech/tts_compat
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    cooldown:
      default-days: 7
    groups:
      http-client:
        patterns: ["httpx2", "httpcore2"]
    commit-message:
      prefix: "sec"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    cooldown:
      default-days: 7
    commit-message:
      prefix: "sec"
