<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>다시잇다 브랜드 자산 미리보기</title>
  <style>
    body { margin: 0; padding: 32px; color: #163a60; background: #f7fbff; font: 18px/1.6 system-ui, sans-serif; }
    main { max-width: 1000px; margin: auto; }
    section { margin: 24px 0; padding: 24px; border: 1px solid #cce5fc; border-radius: 16px; background: white; }
    img { display: block; max-width: 100%; height: auto; }
    .icon { width: 256px; }
    .favicons { display: flex; align-items: end; gap: 24px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; color: #135bba; font-family: 'S-Core Dream', system-ui, sans-serif; text-decoration: none; }
    .brand > img { width: 44px; height: 44px; }
    .brand-name { font-size: 28px; font-weight: 700; line-height: 1.2; }
  </style>
</head>
<body>
  <main>
    <h1>다시잇다 브랜드 자산</h1>
    <section><h2>원본 이미지</h2><img src="../source/original-reference.png" alt="사용자가 제공한 다시잇다 브랜드 이미지 전체"></section>
    <section><h2>로고 락업 · 원본 배경 포함</h2><img src="../logos/original/lockup-with-background.png" alt="다시잇다 심볼, 워드마크, 슬로건"></section>
    <section><h2>심볼 · 원본 배경 포함</h2><img class="icon" src="../symbols/original/symbol-with-background.png" alt="다시잇다 심볼"></section>
    <section><h2>바탕화면 심볼 원본</h2><img class="icon" src="../source/logo-symbol-original.png" alt="바탕화면에서 가져온 다시잇다 심볼 원본"></section>
    <section><h2>웹 상단 로고</h2><a class="brand" href="#"><img src="../source/logo-symbol-original.png" alt=""><span class="brand-name">다시잇다</span></a></section>
    <section><h2>파비콘 크기</h2><div class="favicons"><img src="../icons/favicon/favicon-64.png" alt="64픽셀"><img src="../icons/favicon/favicon-32.png" alt="32픽셀"><img src="../icons/favicon/favicon-16.png" alt="16픽셀"></div></section>
  </main>
</body>
</html>
