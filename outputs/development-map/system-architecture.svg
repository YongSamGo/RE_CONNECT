e" stroke="#6b8199" stroke-width="7" marker-end="url(#arrow)"/><text class="" x="5340" y="3390" font-size="28" font-weight="400" fill="#516b80">Speech Adapter</text><path class="arch-route" d="M5330,3870 L5480,3870 L5480,4090 L5600,4090" fill="none" stroke="#6b8199" stroke-width="7" marker-end="url(#arrow)"/><text class="" x="5335" y="3830" font-size="28" font-weight="400" fill="#516b80">임시 저장·원자 제한</text><path class="arch-route" d="M4100,4070 L4100,4380 L6970,4380 L6970,3900 L7100,3900" fill="none" stroke="#6b8199" stroke-width="7" marker-end="url(#arrow)"/><text class="" x="4150" y="4320" font-size="28" font-weight="400" fill="#516b80">SQLAlchemy 저장소 · VPC 비공개 TLS / CA·호스트 검증</text><path class="arch-route" d="M5000,2970 L5000,2880 L7650,2880 L7650,2970" fill="none" stroke="#6b8199" stroke-width="7" marker-end="url(#arrow)"/><text class="" x="5410" y="2855" font-size="28" font-weight="400" fill="#516b80">인증 코드 교환 · state 검증 / 내부 세션 교체</text><path class="arch-route" d="M2460,4030 L2610,4030 L2610,4450 L7010,4450 L7010,4030 L7100,4030" fill="none" stroke="#6b8199" stroke-width="7" marker-end="url(#arrow)"/><text class="" x="3120" y="4510" font-size="28" font-weight="400" fill="#516b80">검수 대기 공고 저장 · 운영자 승인 후 공개</text><path class="arch-route" d="M1430,4030 L1150,4030" fill="none" stroke="#6b8199" stroke-width="7" marker-end="url(#arrow)"/><text class="" x="1160" y="3980" font-size="28" font-weight="400" fill="#516b80">고정 대상</text><g class="arch-node" data-id="d3s1"><rect x="100" y="2970" width="1050" height="500" rx="16" fill="#ffffff" stroke="#d7e0e9"/><text class="node-title" x="132" y="3032" font-size="44" font-weight="500" fill="#153d59">사용자·운영자 브라우저</text><text class="" x="132" y="3100" font-size="30" font-weight="400" fill="#233247">React · TypeScript</text><text class="" x="132" y="3142" font-size="30" font-weight="400" fill="#233247">Android Chrome / iPhone Safari</text><text class="" x="132" y="3184" font-size="30" font-weight="400" fill="#233247">PC Chrome · 녹음·전사 확인</text><text class="" x="132" y="3226" font-size="30" font-weight="400" fill="#233247">확정·승인 / 선택 저장</text></g><g class="arch-node" data-id="d3s2"><rect x="1430" y="2970" width="1030" height="410" rx="16" fill="#ffffff" stroke="#d7e0e9"/><text class="node-title" x="1462" y="3032" font-size="44" font-weight="500" fill="#153d59">Nginx · HTTPS</text><text class="" x="1462" y="3100" font-size="30" font-weight="400" fill="#233247">프론트엔드 컨테이너</text><text class="" x="1462" y="3142" font-size="30" font-weight="400" fill="#233247">/api/* → FastAPI · 접두사 유지</text><text class="" x="1462" y="3184" font-size="30" font-weight="400" fill="#233247">요청 크기 / 콜백 로그 제어</text></g><g class="arch-node" data-id="d3s1"><rect x="1430" y="3520" width="1030" height="310" rx="16" fill="#ffffff" stroke="#d7e0e9"/><text class="node-title" x="1462" y="3582" font-size="44" font-weight="500" fill="#153d59">React 정적 빌드</text><text class="" x="1462" y="3650" font-size="30" font-weight="400" fill="#233247">Vite 빌드 파일 · 화면 라우트</text><text class="" x="1462" y="3692" font-size="30" font-weight="400" fill="#233247">운영 Vite 서버 공개 없음</text></g><g class="arch-node" data-id="d3s5"><rect x="2750" y="2970" width="2580" height="1100" rx="16" fill="#f7fbff" stroke="#d7e0e9"/><text class="node-title" x="2782" y="3032" font-size="44" font-weight="500" fill="#153d59">FastAPI · Python 3.12</text><text class="" x="2782" y="3100" font-size="30" font-weight="400" fill="#233247">Pydantic / OpenAPI / SQLAlchemy · API → 서비스 → 저장소/Adapter</text><text class="" x="2782" y="3142" font-size="30" font-weight="400" fill="#233247">공통: 동의 · 소유권 · CSRF · 리비전 · 요청 ID · 호출 한도</text></g><g class="arch-node" data-id="d3s4"><rect x="2790" y="3225" width="780" height="230" rx="16" fill="#eef5fa" stroke="#d7e0e9"/><text class="node-title" x="2822" y="3287" font-size="44" font-weight="500" fill="#153d59">Auth / Consent</text><text class="" x="2822" y="3355" font-size="30" font-weight="400" fill="#233247">카카오·세션·MFA / 목적별 동의</text></