ont-size="30" font-weight="400" fill="#233247">직접/생성·편집·승인·저장</text></g><g class="arch-node" data-id="d3s4"><rect x="3620" y="3735" width="780" height="230" rx="16" fill="#eef5fa" stroke="#d7e0e9"/><text class="node-title" x="3652" y="3797" font-size="44" font-weight="500" fill="#153d59">Administration</text><text class="" x="3652" y="3865" font-size="30" font-weight="400" fill="#233247">검수·신고·운영 상태·감사</text></g><g class="arch-node" data-id="d3s4"><rect x="4450" y="3735" width="780" height="230" rx="16" fill="#eef5fa" stroke="#d7e0e9"/><text class="node-title" x="4482" y="3797" font-size="44" font-weight="500" fill="#153d59">Security / Operations</text><text class="" x="4482" y="3865" font-size="30" font-weight="400" fill="#233247">암호화·키·삭제·복구·로그</text></g><g class="arch-node" data-id="d3s3"><rect x="5600" y="2970" width="1100" height="355" rx="16" fill="#ffffff" stroke="#d7e0e9"/><text class="node-title" x="5632" y="3032" font-size="44" font-weight="500" fill="#153d59">Ollama + Qwen3</text><text class="" x="5632" y="3100" font-size="30" font-weight="400" fill="#233247">후보: qwen3:4b</text><text class="" x="5632" y="3142" font-size="30" font-weight="400" fill="#233247">내부 /api/chat · JSON Schema</text><text class="" x="5632" y="3184" font-size="30" font-weight="400" fill="#233247">검증 후 digest 고정 / Cloud OFF</text></g><g class="arch-node" data-id="d3s3"><rect x="5600" y="3440" width="1100" height="420" rx="16" fill="#ffffff" stroke="#d7e0e9"/><text class="node-title" x="5632" y="3502" font-size="44" font-weight="500" fill="#153d59">로컬 음성 서비스</text><text class="" x="5632" y="3570" font-size="30" font-weight="400" fill="#233247">STT: faster-whisper · 다국어 small</text><text class="" x="5632" y="3612" font-size="30" font-weight="400" fill="#233247">TTS: Qwen3-TTS 0.6B · Sohee</text><text class="" x="5632" y="3654" font-size="30" font-weight="400" fill="#233247">음성 메모리/tmpfs · 영구 저장 없음</text><text class="" x="5632" y="3696" font-size="30" font-weight="400" fill="#233247">LLM/STT/TTS 공유 슬롯 초기 1개</text></g><g class="arch-node" data-id="d3s8"><rect x="5600" y="3980" width="1100" height="310" rx="16" fill="#ffffff" stroke="#d7e0e9"/><text class="node-title" x="5632" y="4042" font-size="44" font-weight="500" fill="#153d59">Redis · 임시 데이터</text><text class="" x="5632" y="4110" font-size="30" font-weight="400" fill="#233247">체험·세션·저장 대기·멱등키·한도</text><text class="" x="5632" y="4152" font-size="30" font-weight="400" fill="#233247">RDB / AOF 개인정보 영속화 없음</text></g><g class="arch-node" data-id="d3s1"><rect x="1430" y="3920" width="1030" height="365" rx="16" fill="#ffffff" stroke="#d7e0e9"/><text class="node-title" x="1462" y="3982" font-size="44" font-weight="500" fill="#153d59">공고 수집 실행 명령</text><text class="" x="1462" y="4050" font-size="30" font-weight="400" fill="#233247">6시간 주기 · 출처 제한 우선</text><text class="" x="1462" y="4092" font-size="30" font-weight="400" fill="#233247">안전한 파싱 · 실패≠모집 종료</text><text class="" x="1462" y="4134" font-size="30" font-weight="400" fill="#233247">사용자 개인정보 접근 없음</text></g><g class="arch-node" data-id="d3s1"><rect x="100" y="3920" width="1050" height="400" rx="16" fill="#ffffff" stroke="#d7e0e9"/><text class="node-title" x="132" y="3982" font-size="44" font-weight="500" fill="#153d59">승인 출처·공식 자료</text><text class="" x="132" y="4050" font-size="30" font-weight="400" fill="#233247">취업·공공일자리 / 봉사</text><text class="" x="132" y="4092" font-size="30" font-weight="400" fill="#233247">출처별 고정 API·공식 URL</text><text class="" x="132" y="4134" font-size="30" font-weight="400" fill="#233247">승인 지연 시 공식 자료 수동 검수</text><text class="" x="132" y="4176" font-size="30" font-weight="400" fill="#233247">SSRF·XXE·응답 크기 방어</text></g><g class="arch-node" data-id="d3s7"><rect x="7100" y="2970" width="1190" height="330" rx="16" fill="#ffffff" stroke="#d7e0e9"/><text class="node-title" x="7132" y="3032" font-size="44" font-weight="500" fill="#153d59">카카오 로그인</text><text class="" x="7132" y="3100" font-size="30" font-weight="400" fill="#233247">EC2 밖 외부 인증 경계</text><text class="" x="7132" y="3142" font-size="30" font-weight="400" fill="#233247">state · 허용 콜백 · 세션 교체</text><text class="" x="7132" y="3184" font-size="30" font-weight="400" fill="#233247">로그인 성공만으로 저장 안 함</text></g><g class="arch-node" data-id="d3s2"><rect x="7100" y="3490" width="1190" height="870" rx="16" fill="#ffffff" stroke="#d7e0e9"/><text class="node-title" x="7132" y="3552" font-size="44" font-weight="500" fill="#153d59">Amazon RDS PostgreSQL</text><text class="" x="7132" y="3620" font-size="30" font-weight="400" fill="#233247">EC2 밖 · 동일 VPC 비공개 접근</text><text class="" x="7132" y="3662" font-size="30" font-weight="400" fill="#233247">EC2 보안 그룹에서만 DB 연결</text><text class="" x="7132" y="3704" font-size="30" font-weight="400" fill="#233247">Alembic · 최소권한 DB 계정</text><text class="" x="7132" y="3746" font-size="30" font-weight="400" fill="#233247">User / Consent / ProfileVersion</text><text class="" x="7132" y="3788" font-size="30" font-weight="400" fill="#233247">ApplicationDraft / RoleDefinition</text><text class="" x="7132" y="3830" font-size="30" font-weight="400" fill="#233247">Source / IngestionRun / OpportunityVersion</text><text class="" x="7132" y="3872" font-size="30" font-weight="400" fill="#233247">Report / AuditEvent / DeletionRecord</text><text class="" x="7132" y="3914" font-size="30" font-weight="400" fill="#233247">승인 개인 본문 AES-256-GCM</text><text class="" x="7132" y="3956" font-size="30" font-weight="400" fill="#233247">키 분리 · 백업 7일 · 삭제 재적용</text></g><text class="" x="100" y="4790" font-size="40" font-weight="500" fill="#17354b">추론 경로: 녹음 → 로컬 STT → 전사 확인 → Qwen3 → 초안 → 사용자 확정 / 표시 내용 참조 → 로컬 TTS → 재생</text><text class="" x="100" y="4890" font-size="40" font-weight="500" fill="#17354b">저장 경로: 확정/승인 → 선택 로그인·저장 동의 → 소유권·버전 재검사 → 암호화 RDS / 삭제·만료 뒤 늦은 결과 폐기</text></svg>