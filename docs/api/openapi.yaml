  /admin/mfa/verify:
    post:
      tags: [운영자]
      operationId: verifyMfa
      summary: 운영자 MFA 확인
      description: |
        운영자 역할이 있는 회원 세션만 쓸 수 있다(아니면 403 `FORBIDDEN`). OTP가 틀리면 403 `MFA_INVALID`이다.
        같은 OTP는 다시 쓸 수 없다. OTP 값은 로그·감사 기록에 남기지 않는다.

        - 실패는 세션이 아니라 **운영자 계정** 단위로 센다. 로그아웃·재로그인으로 초기화되지 않는다.
        - 연속 5회 실패하면 잠그고 429 `MFA_LOCKED`(`Retry-After` 포함)로 응답한다. 5번째 실패 응답부터 429다. 잠금 중에는 OTP를 확인하지 않는다.
        - 잠금 시간은 연속 잠금마다 15분 → 1시간 → 24시간으로 늘어난다. 연속 10번 잠기면(연속 실패 50회) 관리 절차로 MFA를 다시 등록할 때까지 429 `MFA_LOCKED`다.
        - 성공하면 실패 횟수와 연속 잠금 횟수를 0으로 되돌린다. 실패와 잠금은 감사 기록(`mfa.fail`, `mfa.lock`)에 남긴다.
        - 아직 인증 앱을 등록하지 않은 운영자는 403 `MFA_INVALID`이고, 감사에는 `mfa.fail`(`denied`)을 15분에 한 번만 남긴다.
        - 성공하면 권한 상승으로 보고 세션·CSRF 쿠키를 새로 발급하고 이전 세션을 폐기한다. MFA 확인은 새 세션에만 기록한다.
        - 확인은 60분 동안 유효하다(`expires_at`). 세션 절대 만료보다 길지 않다. 로그아웃·재로그인·역할 회수·MFA 재등록 뒤에는 다시 확인해야 한다.
        - 인증 앱(TOTP, 30초) 등록·복구와 운영자 역할 부여·회수는 이 API가 아니라 서버의 관리 절차로만 한다(`backend/manage_operators.py`).
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaVerify' }
            examples:
              otp:
                value: { otp: '123456' }
              malformed:
                summary: (오류 예제) 6자리가 아님 → 422
                value: { otp: '12ab' }
      responses:
        '200':
          description: MFA 확인 완료. 새 세션·CSRF 쿠키를 함께 보낸다
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestId' }
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookies' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaStatus' }
              examples:
                verified:
                  value: { mfa_verified: true, expires_at: '2026-10-15T12:00:00Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 운영자 아님·OTP 불일치
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                invalidOtp:
                  value:
                    code: MFA_INVALID
                    message: 인증 번호가 맞지 않습니다.
                    request_id: req_01JABCDXYZ
                forbidden:
                  value:
                    code: FORBIDDEN
                    message: 이 작업을 할 권한이 없습니다.
                    request_id: req_01JABCDXYZ
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429':
          description: OTP 실패로 잠김·호출 한도
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestId' }
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                mfaLocked:
                  value:
                    code: MFA_LOCKED
                    message: 인증 번호를 여러 번 틀려 잠시 잠겼습니다. 잠시 후 다시 시도해 주세요.
                    request_id: req_01JABCDXYZ
                rateLimited:
                  value:
                    code: RATE_LIMITED
                    message: 요청이 많습니다. 잠시 후 다시 시도해 주세요.
                    request_id: req_01JABCDXYZ
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

