  /journeys/{journey_id}/drafts:
    post:
      tags: [체험]
      operationId: createJourneyDraft
      summary: 지원서 초안 만들기 (AI 생성·직접 작성·저장 문서 가져오기)
      description: |
        - `generate`: 로컬 모델이 선택한 확정 사실을 서버가 자기소개 초안으로 조립한다. AI 처리 동의가 필요하다. 지원동기는 추정하지 않고 빈칸으로 두며 직접 작성 안내를 `warnings`로 알린다.
        - `manual`: 빈 초안. AI를 호출하지 않는다.
        - `from_saved`: 현재 회원과 AI 동의를 확인하고 `saved_document`의 자기 문서·정확한 버전을 복호화해 새 임시 초안으로 복사한다. 같은 공고의 현재 공개 버전과 현재 체험의 확정 프로필을 지정한다. 근거가 저장 당시와 다르면 경고하며 본문은 자동으로 바꾸지 않는다. 기존 승인 시각은 복사하지 않고 `revision: 1`, `approved_at: null`로 시작한다. 익명은 401, 다른 회원·없는 문서는 404다.

        종료·비공개·재검수 중인 공고는 409 `OPPORTUNITY_NOT_AVAILABLE`, 확정본이 없으면 409 `PROFILE_NOT_CONFIRMED`.
        초안은 체험 안에 임시로 있고, 승인과 저장은 별도 요청이다. 최대 32개 초안·128회 생성 예약을 허용한다.
        생성 실패·취소된 키는 새 키로 재시도한다. 같은 키의 완료 재생은 추론이나 체험 수명 연장을 반복하지 않는다.
        `generate` 실패: 모델 장애나 확정 사실 밖을 가리킨 모델 출력은 503 `MODEL_UNAVAILABLE`, 60초 초과는 503 `AI_TIMEOUT`이다.
        AI에 보낼 수 있는 확정 사실이 없으면 모델을 부르지 않고 422 `VALIDATION_FAILED`다. 어느 경우든 기존 초안은 바뀌지 않으며 `manual`로 직접 작성할 수 있다.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/JourneyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DraftCreate' }
            examples:
              generate:
                value:
                  profile_version: 2
                  opportunity: { id: 6a5b4c3d-2e1f-4a0b-9c8d-7e6f5a4b3c2d, version: 4 }
                  mode: generate
                  saved_document: null
              fromSaved:
                value:
                  profile_version: 2
                  opportunity: { id: 6a5b4c3d-2e1f-4a0b-9c8d-7e6f5a4b3c2d, version: 4 }
                  mode: from_saved
                  saved_document: { document_id: 5c4b3a29-1807-4f6e-8d5c-4b3a29180716, version: 1 }
              fromSavedWithoutDocument:
                summary: (오류 예제) from_saved인데 문서 없음 → 422
                value:
                  profile_version: 2
                  opportunity: { id: 6a5b4c3d-2e1f-4a0b-9c8d-7e6f5a4b3c2d, version: 4 }
                  mode: from_saved
                  saved_document: null
      responses:
        '201':
          description: 임시 지원서 초안
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JourneyDraft' }
              examples:
                generated:
                  value:
                    draft_id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                    revision: 1
                    mode: generate
                    profile_version: 2
                    opportunity: { id: 6a5b4c3d-2e1f-4a0b-9c8d-7e6f5a4b3c2d, version: 4 }
                    self_introduction: "경험: 초등학교에서 30년 동안 국어를 가르쳤습니다."
                    motivation: ''
                    approved_at: null
                    review_reasons: []
                    warnings: [지원동기는 추정하지 않았습니다. 공고를 확인하고 직접 작성해 주세요.]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 공고 이용 불가·미확정·멱등 키 충돌
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestId' }
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                opportunityNotAvailable:
                  value:
                    code: OPPORTUNITY_NOT_AVAILABLE
                    message: 모집이 끝났거나 내용을 확인 중인 공고입니다. 공고를 다시 확인해 주세요.
                    request_id: req_01JABCDXYZ
                profileNotConfirmed:
                  value:
                    code: PROFILE_NOT_CONFIRMED
                    message: 프로필을 먼저 확정해 주세요.
                    request_id: req_01JABCDXYZ
                idempotencyKeyReused: { $ref: '#/components/examples/IdempotencyKeyReused' }
                requestInProgress: { $ref: '#/components/examples/RequestInProgress' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /journeys/{journey_id}/drafts/{draft_id}:
    get:
      tags: [체험]
      operationId: getJourneyDraft
      summary: 소유 체험 지원서와 현재 재검토 사유 조회
      description: |
        유효한 자기 체험 안의 특정 지원서만 조회한다. 목록·이전 세션·대화 복원 API가 아니다.
        원래 profile_version/opportunity/본문/approved_at/revision은 보존하고 현재 근거 변화만 review_reasons/warnings로 알린다.
        조회는 체험 유휴 수명을 연장하지 않는다. AI 동의나 모델 호출이 필요하지 않다.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/JourneyId'
        - $ref: '#/components/parameters/DraftId'
      responses:
        '200':
          description: 원래 지원서와 현재 재검토 안내
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JourneyDraft' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      tags: [체험]
      operationId: updateJourneyDraft
      summary: 지원서 초안 수정
      description: |
        본문 전체를 바꾼다. 수정하면 승인이 풀리고(`approved_at=null`) 다시 승인해야 저장할 수 있다.
        지원서 자체의 base_revision으로 CAS하며 프로필/체험 리비전과 구분한다.
        근거가 변경되거나 공고가 닫혀도 직접 작성한 편집은 유지할 수 있으나 새 승인은 유효성 검사 뒤에만 가능하다.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/JourneyId'
        - $ref: '#/components/parameters/DraftId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DraftUpdate' }
            examples:
              edit:
                value:
                  self_introduction: 초등학교에서 30년 동안 국어를 가르쳤습니다.
                  motivation: 아이들에게 책 읽는 즐거움을 전하고 싶습니다.
                  base_revision: 1
      responses:
        '200':
          description: 수정한 초안
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JourneyDraft' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /journeys/{journey_id}/drafts/{draft_id}/approve:
    post:
      tags: [체험]
      operationId: approveJourneyDraft
      summary: 지원서 초안 사용자 승인
      description: |
