  /journeys/{journey_id}/transcriptions:
    post:
      tags: [체험]
      operationId: createTranscription
      summary: 녹음 전사 (로컬 STT)
      description: |
        AI 처리 동의가 필요하다. 원본 음성은 메모리·tmpfs에서만 처리하고 전사 후 바로 정리한다.
        전사 결과는 자동으로 프로필에 쓰이지 않는다. 사용자가 확인·수정한 텍스트를 `messages`로 보낸다.
        같은 키/파일 해시의 완료 재생은 새 STT나 체험 수명 연장을 하지 않는다. 실패/취소된 키는 새 키로 재시도한다.
        원본 음성/파일명은 Redis에 저장하지 않는다. 전사 결과와 참조는 같은 체험 해시 안에 두며 종료/만료 시 함께 폐기한다.
        현재 단일 audio part만 받는 메모리 전용 업로드를 사용한다. 압축 codec/무음 검사는 내부 모델 서버 #31의 구현/실측을 기다린다.
        실제 내부 모델 서비스가 준비되지 않으면 503이며 가상 전사로 대체하지 않는다.
        90초를 넘는 녹음은 422(`audio`, `out_of_range`), 6MiB를 넘으면 413이다.

        - 서버는 Content-Type을 믿지 않고 파일 시그니처(WebM·Ogg·MP4·RIFF/WAVE)와 디코더 프로브(길이·코덱)로 형식을 확인한다.
          맞지 않으면 422(`audio`, `invalid_value`). 디코더는 허용 코덱만 쓰고 시간·메모리 제한을 둔다.
        - 화면은 압축 형식(webm/opus 또는 mp4/aac)을 권장한다. WAV는 16kHz·16비트 모노로만 보낸다(90초 약 2.9MB).
          44.1kHz 이상 WAV는 90초 전에 6MiB를 넘어 413이 된다.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/JourneyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [audio]
              properties:
                audio:
                  type: string
                  contentMediaType: application/octet-stream
                  description: 녹음 파일. 최대 90초·6MiB. WebM·Ogg·MP4 압축 형식 권장, WAV는 16kHz·16비트 모노
            encoding:
              audio:
                contentType: audio/webm, audio/ogg, audio/mp4, audio/wav
      responses:
        '201':
          description: 전사 결과
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transcription' }
              examples:
                transcribed:
                  value:
                    transcription_id: 7f6e5d4c-3b2a-4190-8f7e-6d5c4b3a2910
                    text: 초등학교에서 삼십 년 동안 국어를 가르쳤어요.
                    duration_seconds: 6.4
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422':
          description: 형식 오류·지원하지 않는 음성 형식·90초 초과
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                tooLong:
                  value:
                    code: VALIDATION_FAILED
                    message: 녹음은 한 번에 90초까지 할 수 있습니다.
                    request_id: req_01JABCDXYZ
                    fields:
                      - path: audio
                        reason: out_of_range
                missingAudio:
                  value:
                    code: VALIDATION_FAILED
                    message: 입력 내용을 확인해 주세요.
                    request_id: req_01JABCDXYZ
                    fields:
                      - path: audio
                        reason: required
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /journeys/{journey_id}/messages:
    post:
      tags: [체험]
      operationId: createMessage
      summary: 확인한 답변 보내기와 다음 질문·프로필 초안 받기
      description: |
        AI 처리 동의가 필요하다. 로컬 Qwen3가 프로필 초안을 추출하고 다음 질문을 하나 만든다.
        결과는 Pydantic 검증과 근거 참조 검사를 통과한 것만 돌려준다. 확정은 별도 요청이다.
        직접 입력은 null 전사 참조를 쓴다. 전사 ID가 있으면 같은 세션/체험의 유효한 전사인지 확인하고 사용자가 확인·수정해 보낸 text만 추출에 사용한다. 전사 원문을 자동으로 덧붙이지 않는다.
        경험은 원문 근거로 추가하고 기존 직접 편집 경험·다른 프로필 필드·확정본은 덮어쓰지 않는다.
        실패/취소 시 본문과 초안은 반영하지 않는다. 완료 응답 재전송은 당시 리비전을 그대로 반환하므로 화면은 최신 편집과 구분해야 한다.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/JourneyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageCreate' }
            examples:
              fromVoice:
                summary: 전사를 고쳐서 보냄
                value:
                  text: 초등학교에서 30년 동안 국어를 가르쳤어요.
                  transcription_id: 7f6e5d4c-3b2a-4190-8f7e-6d5c4b3a2910
