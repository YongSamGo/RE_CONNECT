        change_pending: false

  schemas:
    ErrorCode:
      type: string
      description: 상태 코드별 의미는 docs/api/README.md §2.5
      enum:
        - UNAUTHENTICATED
        - SESSION_EXPIRED
        - FORBIDDEN
        - CSRF_FAILED
        - MFA_REQUIRED
        - CONSENT_REQUIRED
        - REAUTH_REQUIRED
        - NOT_FOUND
        - SAVE_INTENT_NOT_FOUND
        - VERSION_CONFLICT
        - IDEMPOTENCY_KEY_REUSED
        - REQUEST_IN_PROGRESS
        - REQUEST_ALREADY_COMPLETED
        - PROFILE_NOT_CONFIRMED
        - PROFILE_NOT_SAVED
        - DRAFT_NOT_APPROVED
        - OPPORTUNITY_NOT_AVAILABLE
        - INVALID_STATE_TRANSITION
        - ALREADY_SIGNED_IN
        - PAYLOAD_TOO_LARGE
        - VALIDATION_FAILED
        - RATE_LIMITED
        - DAILY_QUOTA_EXCEEDED
        - INFERENCE_BUSY
        - INTERNAL_ERROR
        - MODEL_UNAVAILABLE
        - AI_TIMEOUT
        - SERVICE_UNAVAILABLE

    Error:
      type: object
      description: 모든 오류의 공통 본문. 원본 입력·SQL·토큰·파일 경로·예외 추적을 넣지 않는다
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message:
          type: string
          maxLength: 200
          description: 사용자에게 보여 줄 한국어 문장
        request_id:
          type: string
          pattern: '^req_[0-9A-Za-z]{10,32}$'
          description: 서버가 붙인 추적 ID. 클라이언트 멱등 키와 다르다
        fields:
          type: array
          description: 422에만 붙는다
          maxItems: 50
          items: { $ref: '#/components/schemas/FieldError' }

    FieldError:
      type: object
      additionalProperties: false
      required: [path, reason]
      properties:
        path:
          type: string
          maxLength: 200
          description: 점 경로. 예 `profile.preferred_regions[0].district`
        reason:
          type: string
          enum: [required, invalid_type, invalid_value, too_long, too_short, out_of_range, unknown_field, required_with]

    ConsentPurpose:
      type: string
      enum: [ai_processing, storage]
      description: ai_processing = EC2 자체 AI 처리(대화·음성·읽어주기), storage = 회원 영구 저장

    ConsentState:
      type: object
      additionalProperties: false
      required: [purpose, notice_version, granted_at]
      properties:
        purpose: { $ref: '#/components/schemas/ConsentPurpose' }
        notice_version:
          type: string
          pattern: '^[a-z0-9._-]{1,32}$'
        granted_at: { type: string, format: date-time }

    Me:
      type: object
      additionalProperties: false
      required: [authenticated, user, consents, pending_save_intent]
      properties:
        authenticated: { type: boolean }
        user:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [id, roles, mfa_verified]
              properties:
                id: { type: string, format: uuid }
                roles:
                  type: array
                  items: { type: string, enum: [user, operator] }
                mfa_verified:
                  type: boolean
                  description: 운영자 MFA를 이 세션에서 완료했는지. 일반 사용자는 항상 false
        consents:
          type: array
          description: 현재 유효한 동의만. 철회·폐기 버전은 빠진다
          items: { $ref: '#/components/schemas/ConsentState' }
        pending_save_intent:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/PendingSaveIntent'

    SaveIntentCreate:
      type: object
      additionalProperties: false
      required: [journey_id, profile, draft]
      description: |
        profile·draft 중 하나 이상. draft가 있으면 profile도 필수.
        둘 다 null이면 422 `fields: [{path: profile, reason: required}]`, draft만 있으면 422 `fields: [{path: profile, reason: required_with}]`.
      not:
        description: profile·draft가 모두 null이면 거절
        properties:
          profile: { type: 'null' }
          draft: { type: 'null' }
      properties:
        journey_id: { type: string, format: uuid }
        profile:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [version]
              properties:
                version:
                  type: integer
                  minimum: 1
                  description: 이 체험의 확정 프로필 버전
        draft:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [draft_id, revision]
              properties:
                draft_id: { type: string, format: uuid }
                revision:
                  type: integer
                  minimum: 1
                  description: 승인한 임시 지원서의 리비전

    SaveIntentTargets:
      type: object
      additionalProperties: false
      required: [profile, draft]
      properties:
        profile: { type: boolean }
        draft: { type: boolean }

    SaveIntent:
      type: object
      additionalProperties: false
      required: [save_intent_id, expires_at, targets]
      properties:
        save_intent_id:
          type: string
          format: uuid
          description: opaque 참조. URL에 넣지 않는다
        expires_at:
          type: string
          format: date-time
          description: 발급 후 10분
        targets: { $ref: '#/components/schemas/SaveIntentTargets' }

    PendingSaveIntent:
      type: object
      additionalProperties: false
      required: [save_intent_id, expires_at, targets, existing_saved_profile_version]
      properties:
        save_intent_id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
        targets: { $ref: '#/components/schemas/SaveIntentTargets' }
        existing_saved_profile_version:
          type: [integer, 'null']
          minimum: 1
          description: 로그인한 회원의 현재 저장 프로필 버전. 있으면 화면이 교체 여부를 묻고 base_saved_version으로 보낸다

    SaveIntentSource:
      type: object
      additionalProperties: false
      required: [type, save_intent_id]
      properties:
        type: { type: string, const: save_intent }
        save_intent_id: { type: string, format: uuid }

    JourneyProfileSource:
      type: object
      additionalProperties: false
      required: [type, journey_id, version]
      properties:
        type: { type: string, const: journey }
        journey_id: { type: string, format: uuid }
        version:
          type: integer
          minimum: 1
          description: 체험의 확정 프로필 버전

    JourneyDraftSource:
      type: object
      additionalProperties: false
      required: [type, journey_id, draft_id, revision]
      properties:
        type: { type: string, const: journey }
        journey_id: { type: string, format: uuid }
        draft_id: { type: string, format: uuid }
        revision:
          type: integer
          minimum: 1
          description: 승인한 임시 지원서의 리비전

    ProfileSaveRequest:
      type: object
      additionalProperties: false
      required: [source, base_saved_version]
      properties:
        source:
          oneOf:
            - $ref: '#/components/schemas/SaveIntentSource'
            - $ref: '#/components/schemas/JourneyProfileSource'
          discriminator:
            propertyName: type
            mapping:
              save_intent: '#/components/schemas/SaveIntentSource'
              journey: '#/components/schemas/JourneyProfileSource'
        base_saved_version:
          type: [integer, 'null']
          minimum: 1
          description: 교체할 현재 저장본 버전. 저장본이 없으면 null. 최신이 아니면 409

    ProfileSaveResult:
      type: object
      additionalProperties: false
      required: [version, saved_at, created, replaced_version]
      properties:
        version: { type: integer, minimum: 1 }
        saved_at: { type: string, format: date-time }
        created:
          type: boolean
          description: false면 같은 내용의 기존 저장본을 연결했다
        replaced_version: { type: [integer, 'null'], minimum: 1 }

    DraftSaveRequest:
      type: object
      additionalProperties: false
      required: [source, document_id, base_document_version]
      properties:
        source:
          oneOf:
            - $ref: '#/components/schemas/SaveIntentSource'
            - $ref: '#/components/schemas/JourneyDraftSource'
          discriminator:
            propertyName: type
            mapping:
              save_intent: '#/components/schemas/SaveIntentSource'
              journey: '#/components/schemas/JourneyDraftSource'
        document_id:
          type: [string, 'null']
          format: uuid
          description: 기존 저장 문서를 갱신할 때만. base_document_version과 함께 보낸다
        base_document_version:
          type: [integer, 'null']
          minimum: 1

    DraftSaveResult:
      type: object
      additionalProperties: false
      required: [document_id, version, saved_at, profile_version]
      properties:
        document_id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        saved_at: { type: string, format: date-time }
        profile_version:
          type: integer
          minimum: 1
          description: 연결한 회원 저장 프로필 버전

    RoleId:
      type: string
      pattern: '^[a-z][a-z0-9_]{1,63}$'
      description: 역할 사전(RoleDefinition)의 키. 공고 role_tags도 같은 키를 쓴다

    RoleExclusionUpdate:
      type: object
      additionalProperties: false
      required: [role_ids, base_revision]
      properties:
        role_ids:
          type: array
          maxItems: 50
          uniqueItems: true
          items: { $ref: '#/components/schemas/RoleId' }
        base_revision: { type: integer, minimum: 1 }

    RoleExclusions:
      type: object
      additionalProperties: false
      required: [role_ids, revision]
      properties:
        role_ids:
          type: array
          items: { $ref: '#/components/schemas/RoleId' }
        revision: { type: integer, minimum: 1 }

    SpeechRequest:
      type: object
      additionalProperties: false
      required: [target, segment]
      properties:
        target: { $ref: '#/components/schemas/SpeechTarget' }
        segment:
          type: integer
          minimum: 0
          maximum: 9
          description: 2,000자 단위 조각 번호(0부터). 응답 헤더 X-Speech-Segment-Count를 넘으면 422

    SpeechTarget:
      description: 화면에 보이는 자료의 참조. 대상마다 읽을 수 있는 필드가 정해져 있다
      oneOf:
        - $ref: '#/components/schemas/SpeechTargetJourneyMessage'
        - $ref: '#/components/schemas/SpeechTargetJourneyDraft'
        - $ref: '#/components/schemas/SpeechTargetSavedDraft'
        - $ref: '#/components/schemas/SpeechTargetOpportunity'
      discriminator:
        propertyName: kind
        mapping:
          journey_message: '#/components/schemas/SpeechTargetJourneyMessage'
          journey_draft: '#/components/schemas/SpeechTargetJourneyDraft'
          saved_draft: '#/components/schemas/SpeechTargetSavedDraft'
          opportunity: '#/components/schemas/SpeechTargetOpportunity'

    SpeechTargetJourneyMessage:
      type: object
      additionalProperties: false
      required: [kind, journey_id, message_id]
      properties:
        kind: { type: string, const: journey_message }
        journey_id: { type: string, format: uuid }
        message_id:
          type: string
          format: uuid
          description: 체험의 AI 질문 메시지

    SpeechTargetJourneyDraft:
      type: object
      additionalProperties: false
      required: [kind, journey_id, draft_id, revision, field]
      properties:
        kind: { type: string, const: journey_draft }
        journey_id: { type: string, format: uuid }
        draft_id: { type: string, format: uuid }
        revision: { type: integer, minimum: 1 }
        field: { type: string, enum: [self_introduction, motivation] }

    SpeechTargetSavedDraft:
      type: object
      additionalProperties: false
      required: [kind, document_id, version, field]
      properties:
        kind: { type: string, const: saved_draft }
        document_id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        field: { type: string, enum: [self_introduction, motivation] }

    SpeechTargetOpportunity:
      type: object
      additionalProperties: false
      required: [kind, opportunity_id, version, field]
      properties:
        kind: { type: string, const: opportunity }
        opportunity_id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        field:
          type: string
          enum: [title, description_text, schedule_text, location_text, compensation_text, application_instructions]

    OpportunityRejectRequest:
      type: object
      additionalProperties: false
      required: [base_version, reason_code, note]
      properties:
        base_version:
          type: integer
          minimum: 1
          description: 검수 중인 pending 버전
        reason_code:
          type: string
          enum:
            - source_unverifiable
            - out_of_scope
            - recruitment_closed
            - duplicate
            - insufficient_information
            - inappropriate_content
            - other
          description: |
            source_unverifiable 공식 원문·접수 경로 확인 불가, out_of_scope 지역·유형 범위 밖,
            recruitment_closed 이미 모집 종료, duplicate 같은 공고가 이미 있음,
            insufficient_information 필수 정보 부족, inappropriate_content 부적절한 내용, other 기타(메모 필수)
        note:
          type: [string, 'null']
          maxLength: 500
          description: 개인정보를 적지 않는다

    OpportunityReviewResult:
      type: object
      additionalProperties: false
      required: [id, version, review_status, reviewed_at]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        review_status: { type: string, enum: [pending, approved, rejected, hidden] }
        reviewed_at: { type: string, format: date-time }

    Province:
      type: string
      enum: [seoul, gyeonggi, incheon]

    Region:
      type: object
      additionalProperties: false
      required: [province, district]
      properties:
        province: { $ref: '#/components/schemas/Province' }
        district:
          type: [string, 'null']
          pattern: '^[a-z0-9_]{2,40}$'
          description: 서버 지역 목록의 시·군·구 식별값. null이면 시·도 전체

    Requirement:
      type: object
      additionalProperties: false
      required: [id, field, operator, value, group_id, group_operator, reference_date, source_evidence, clarity]
      description: |
        필드별 허용 연산과 값 (Plan/02 §4 표와 같다):

        | field | operator | value |
        |---|---|---|
        | age | gte, lte | integer (만 나이) |
        | age | between | [min, max] integer 2개 |
        | residence_region | in | Region[] |
        | certification, completed_course | has_all, has_any | string[] |
        | weekday | includes_all, includes_any | integer[] (1=월 ~ 7=일) |
        | hours_per_week | gte, lte | number |
        | other | null | null (clarity=needs_review) |

        표에 없는 조합은 422. 해석하지 못한 조건은 field=other, clarity=needs_review와 원문 근거로 보존한다.
      properties:
        id: { type: string, format: uuid }
        field:
          type: string
          enum: [age, residence_region, certification, completed_course, weekday, hours_per_week, other]
        operator:
          type: [string, 'null']
          enum: [gte, lte, between, in, has_all, has_any, includes_all, includes_any, null]
        value:
          oneOf:
            - type: 'null'
            - type: number
            - type: array
              items: { type: number }
              minItems: 1
              maxItems: 7
            - type: array
              items: { type: string, maxLength: 100 }
              minItems: 1
              maxItems: 20
            - type: array
              items: { $ref: '#/components/schemas/Region' }
              minItems: 1
              maxItems: 30
        group_id: { type: [string, 'null'], format: uuid }
        group_operator:
          type: [string, 'null']
          enum: [and, or, null]
        reference_date:
          type: [string, 'null']
          format: date
          description: 연령 등 판정 기준일
        source_evidence:
          type: string
          maxLength: 1000
          description: 원문 조건 문장
        clarity: { type: string, enum: [clear, needs_review] }

    Opportunity:
      type: object
      description: 공개 공고 상세. 내부 필드(source_id, external_id, content_hash, review_status)는 내보내지 않는다
      additionalProperties: false
      required:
        - id
        - version
        - title
        - organization_name
        - activity_type
        - is_public_job
        - role_tags
        - skill_tags
        - activity_region
        - location_text
        - remote_allowed
        - schedule_text
        - hours_per_week
        - paid
        - compensation_text
        - description_text
        - description_truncated
        - requirements
        - required_documents
        - application_method
        - application_instructions
        - source_url
        - application_url
        - deadline_date
        - deadline_at
        - recruitment_status
        - source_checked_at
        - reviewed_at
        - change_pending
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        title: { type: string, maxLength: 200 }
        organization_name: { type: string, maxLength: 200 }
        activity_type: { type: string, enum: [employment, volunteering] }
        is_public_job: { type: [boolean, 'null'] }
        role_tags:
          type: array
          items: { $ref: '#/components/schemas/RoleId' }
        skill_tags:
          type: array
          items: { type: string, maxLength: 50 }
        activity_region:
          description: 원격이 아닌 공고의 활동 지역. 모르면 null(지역 기준 추천에서 제외)
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Region'
        location_text: { type: [string, 'null'], maxLength: 500 }
        remote_allowed: { type: [boolean, 'null'] }
        schedule_text: { type: [string, 'null'], maxLength: 500 }
        hours_per_week: { type: [number, 'null'], minimum: 0, maximum: 168 }
        paid: { type: [boolean, 'null'] }
        compensation_text: { type: [string, 'null'], maxLength: 500 }
        description_text:
          type: [string, 'null']
          maxLength: 5000
          description: |
            공식 원문 설명(일반 텍스트). 검색 계산과 상세 표시에 쓰고 검수 대상이다.
            값이 없으면 null이며 설명을 만들어 채우지 않는다
        description_truncated:
          type: boolean
          description: 원문이 5,000자를 넘어 앞부분만 저장했으면 true
        requirements:
          type: array
          description: 빈 배열은 "명시된 필수조건 없음"으로 검수한 상태
          items: { $ref: '#/components/schemas/Requirement' }
        required_documents:
          type: [array, 'null']
          items: { type: string, maxLength: 200 }
        application_method: { type: string, enum: [online, phone, visit, email, mixed] }
        application_instructions: { type: string, maxLength: 2000 }
        source_url: { type: string, format: uri, pattern: '^https://' }
        application_url: { type: string, format: uri, pattern: '^https://' }
        deadline_date:
          type: [string, 'null']
          format: date
