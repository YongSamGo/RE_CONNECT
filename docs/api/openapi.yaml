        request_id: req_01JABCDXYZ
    RequestInProgress:
      value:
        code: REQUEST_IN_PROGRESS
        message: 앞선 요청을 처리하고 있습니다. 잠시 기다려 주세요.
        request_id: req_01JABCDXYZ
    OpportunityVolunteering:
      value:
        id: 6a5b4c3d-2e1f-4a0b-9c8d-7e6f5a4b3c2d
        version: 4
        title: 도서관 어르신 책 읽어주기 봉사
        organization_name: 용산구립도서관
