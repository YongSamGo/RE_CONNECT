        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [회원 저장]
      operationId: saveDraft
      summary: 승인한 지원서를 암호화 저장
      description: |
        `source.type=journey`는 회원이 체험의 승인 지원서를, `source.type=save_intent`는 로그인 왕복 직후 저장 대기의 지원서를 저장한다.

        - 근거 프로필이 회원 저장본과 연결되지 않으면 409 `PROFILE_NOT_SAVED`. 화면은 프로필도 함께 저장하겠다는 동의를 받고 `POST /profiles/me/versions`를 먼저 부른다.
        - 기존 문서를 갱신하려면 `document_id`와 `base_document_version`을 함께 넣는다.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DraftSaveRequest' }
            examples:
              fromSaveIntent:
                value:
                  source:
                    type: save_intent
                    save_intent_id: 0b9f4c4e-2a1f-4d8e-9b7a-6c5d4e3f2a1b
                  document_id: null
                  base_document_version: null
              updateExisting:
                summary: 회원이 저장 문서를 고쳐 다시 승인한 뒤 갱신
                value:
                  source:
                    type: journey
                    journey_id: 3f6e2b1a-8c4d-4e5f-9a0b-1c2d3e4f5a6b
                    draft_id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                    revision: 7
                  document_id: 5c4b3a29-1807-4f6e-8d5c-4b3a29180716
                  base_document_version: 2
      responses:
        '201':
          description: 저장 완료
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DraftSaveResult' }
              examples:
                created:
                  value:
                    document_id: 5c4b3a29-1807-4f6e-8d5c-4b3a29180716
                    version: 1
                    saved_at: '2026-10-15T03:13:00Z'
                    profile_version: 1
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 버전 충돌·근거 프로필 미저장·미승인·멱등 키 충돌
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestId' }
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                profileNotSaved:
                  value:
                    code: PROFILE_NOT_SAVED
                    message: 지원서의 근거가 되는 프로필을 먼저 저장해야 합니다.
                    request_id: req_01JABCDXYZ
                versionConflict: { $ref: '#/components/examples/VersionConflict' }
                requestInProgress: { $ref: '#/components/examples/RequestInProgress' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /journeys/{journey_id}/role-exclusions:
    get:
      tags: [체험]
      operationId: getRoleExclusions
      summary: 현재 체험의 전체 역할 제외 목록 조회
      description: 후보 목록에 표시되지 않는 역할도 포함한다. 전체 교체 PUT에서 기존 선택을 보존하기 위해 사용한다. 확정 프로필이 없으면 409이며 조회로 체험 수명을 연장하지 않는다.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/JourneyId'
      responses:
        '200':
          description: 현재 전체 제외 목록과 리비전
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleExclusions' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    put:
      tags: [체험]
      operationId: putRoleExclusions
      summary: 현재 체험의 추천에서 제외할 역할 지정
      description: |
        제외 목록 전체를 바꾼다. 빈 배열이면 모두 복원한다. 프로필 사실은 바뀌지 않고 저장되지도 않는다.
        공고 `role_tags`에 제외한 역할이 하나라도 있으면 맞춤 추천에서 뺀다. 공개 공고 검색에는 적용하지 않는다.
        확정 프로필이 없으면 409 `PROFILE_NOT_CONFIRMED`.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/JourneyId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleExclusionUpdate' }
            examples:
              exclude:
                value:
                  role_ids: [care_assistant]
                  base_revision: 12
              restoreAll:
                value:
                  role_ids: []
                  base_revision: 13
      responses:
        '200':
          description: 반영한 제외 목록
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleExclusions' }
              examples:
                updated:
                  value:
                    role_ids: [care_assistant]
                    revision: 13
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422':
          description: 형식 오류·없는 역할 ID
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                unknownRole:
                  value:
                    code: VALIDATION_FAILED
                    message: 입력 내용을 확인해 주세요.
                    request_id: req_01JABCDXYZ
                    fields:
                      - path: role_ids[0]
                        reason: invalid_value
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

