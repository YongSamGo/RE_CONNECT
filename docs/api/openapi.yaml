  /admin/reports/{report_id}:
    patch:
      tags: [운영자]
      operationId: updateReport
      summary: 신고 처리
      description: |
        `received` → `in_progress` → `resolved`·`dismissed`. `resolved`·`dismissed`이면 `resolution_note`가 필수다.
        공고 수정·종료는 공고 API로 따로 한다.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ReportId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportUpdate' }
            examples:
              resolve:
                value:
                  base_version: 2
                  status: resolved
                  resolution_note: 모집 종료 처리함
      responses:
        '200':
          description: 처리한 신고
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/audit:
    get:
      tags: [운영자]
      operationId: listAudit
      summary: 최소 감사 기록 조회
      description: 기간은 최대 30일(보관기간과 같음)이다. 개인 본문·OTP·토큰은 기록에 없다.
      security:
        - sessionCookie: []
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 감사 기록
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditList' }
              examples:
                events:
                  value:
                    items:
                      - event_id: e9d8c7b6-a5f4-4e3d-9c2b-1a0f9e8d7c6b
                        at: '2026-10-15T04:00:00Z'
                        actor_id: 7d3c1d9e-3a52-4c55-9a43-2f1f6d1b8a10
                        actor_role: operator
                        action: opportunity.approve
                        target_type: opportunity
                        target_id: 6a5b4c3d-2e1f-4a0b-9c8d-7e6f5a4b3c2d
                        result: success
                        request_id: req_01JABCDXYZ
                    page: 1
                    page_size: 20
                    total: 1
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /health/live:
    servers:
      - url: http://backend:8000
        description: Compose 내부 전용. Nginx로 공개하지 않는다
    get:
      tags: [내부 상태]
      operationId: healthLive
      summary: 프로세스 생존 확인 (내부 전용)
      security: []
      responses:
        '200':
          description: 살아 있음
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { type: string, const: ok }
              examples:
                ok:
                  value: { status: ok }

  /health/ready:
    servers:
      - url: http://backend:8000
        description: Compose 내부 전용. Nginx로 공개하지 않는다
    get:
      tags: [내부 상태]
      operationId: healthReady
      summary: 요청 처리 준비 확인 (내부 전용)
      description: |
        DB·Redis가 정상이면 200, 아니면 503. 모델·음성 서비스 장애는 `degraded`로 200을 유지해
        공개 공고 조회를 계속한다. 버전·주소·오류 메시지는 넣지 않는다.
      security: []
      responses:
        '200':
          description: 준비됨 또는 AI 기능만 저하
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
              examples:
                ready:
                  value:
                    status: ready
                    checks: { db: ok, redis: ok, llm: ok, speech: ok }
                degraded:
                  value:
                    status: degraded
                    checks: { db: ok, redis: ok, llm: fail, speech: ok }
        '503':
          description: DB 또는 Redis 장애
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
              examples:
                unavailable:
                  value:
                    status: unavailable
                    checks: { db: ok, redis: fail, llm: ok, speech: ok }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-rc_session
      description: |
        HttpOnly·Secure·SameSite=Lax 세션 쿠키. 비회원도 익명 세션을 가진다. 로컬 HTTP 개발에서는 `rc_session`.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        CSRF 쿠키(`__Host-rc_csrf`, 로컬 `rc_csrf`) 값을 그대로 넣는다. GET이 아닌 모든 요청에 필수.
        서버는 헤더·쿠키 일치, 세션 결합 서명, Origin을 함께 확인한다.
        CSRF 쿠키 속성: `Path=/; Secure; SameSite=Strict`, HttpOnly 아님(화면이 읽는다), 세션 쿠키와 같은 수명.
        로컬 HTTP 개발에서만 `Secure`를 뺀다.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        클라이언트가 만든 UUID. 같은 키·같은 입력은 첫 결과를 다시 돌려주고 새로 실행하지 않는다.
        같은 키·다른 입력은 409 `IDEMPOTENCY_KEY_REUSED`, 처리 중이면 409 `REQUEST_IN_PROGRESS`.
      schema: { type: string, format: uuid }
    JourneyId:
      name: journey_id
      in: path
      required: true
      description: 사적 자원 참조. 인증 수단이 아니며 서버가 세션 소유권을 함께 확인한다
      schema: { type: string, format: uuid }
    OpportunityId:
      name: opportunity_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    DraftId:
      name: draft_id
      in: path
      required: true
      description: 체험 안의 임시 지원서 ID
      schema: { type: string, format: uuid }
    DocumentId:
      name: document_id
      in: path
      required: true
      description: 회원 저장 지원서 문서 ID
      schema: { type: string, format: uuid }
    ReportId:
      name: report_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 20, default: 20 }

  headers:
    XRequestId:
      description: 서버가 붙인 추적 ID. 오류 본문의 `request_id`와 같다
      schema: { type: string, pattern: '^req_[0-9A-Za-z]{10,32}$' }
    SetSessionCookies:
      description: |
        세션 쿠키(`__Host-rc_session`: HttpOnly; Secure; SameSite=Lax; Path=/)와
        CSRF 쿠키(`__Host-rc_csrf`: Secure; SameSite=Strict; Path=/)를 새로 만들거나 바꿀 때만 붙는다.
        로그인·로그아웃·탈퇴에서는 두 쿠키를 모두 교체한다.
      schema: { type: string }
    NoStore:
      description: 개인 자료·음성 응답은 저장하지 않는다
      schema: { type: string, const: no-store }
    RetryAfter:
      description: 다시 시도할 수 있을 때까지의 초
      schema: { type: integer, minimum: 1 }

  responses:
    Unauthorized:
      description: 미인증·세션 만료
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            unauthenticated:
              value:
                code: UNAUTHENTICATED
                message: 로그인이 필요합니다.
                request_id: req_01JABCDXYZ
            sessionExpired:
              value:
                code: SESSION_EXPIRED
                message: 접속 시간이 지나 다시 로그인해야 합니다.
                request_id: req_01JABCDXYZ
    Forbidden:
      description: 권한·CSRF·MFA·동의 실패
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            csrfFailed:
              value:
                code: CSRF_FAILED
                message: 요청을 확인할 수 없습니다. 화면을 새로 고친 뒤 다시 시도해 주세요.
                request_id: req_01JABCDXYZ
            consentRequired:
              value:
                code: CONSENT_REQUIRED
                message: 이 기능을 쓰려면 먼저 안내를 확인하고 동의해 주세요.
                request_id: req_01JABCDXYZ
    AdminForbidden:
      description: 운영자 역할 없음·MFA 미완료·CSRF 실패
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            mfaRequired:
              value:
                code: MFA_REQUIRED
                message: 추가 인증이 필요합니다.
                request_id: req_01JABCDXYZ
            forbidden:
              value:
                code: FORBIDDEN
                message: 이 작업을 할 권한이 없습니다.
                request_id: req_01JABCDXYZ
            csrfFailed:
              value:
                code: CSRF_FAILED
                message: 요청을 확인할 수 없습니다. 화면을 새로 고친 뒤 다시 시도해 주세요.
                request_id: req_01JABCDXYZ
    NotFound:
      description: 없는 자원 또는 접근할 수 없는 사적 자원(둘을 구분하지 않음)
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            notFound:
              value:
                code: NOT_FOUND
                message: 찾을 수 없거나 이용 시간이 지났습니다.
                request_id: req_01JABCDXYZ
            saveIntentNotFound:
              value:
                code: SAVE_INTENT_NOT_FOUND
                message: 저장 대기 시간이 지났거나 이미 처리되었습니다. 다시 저장해 주세요.
                request_id: req_01JABCDXYZ
    Conflict:
      description: 버전·상태 충돌, 멱등 키 충돌
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestId' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            versionConflict: { $ref: '#/components/examples/VersionConflict' }
            idempotencyKeyReused: { $ref: '#/components/examples/IdempotencyKeyReused' }
            requestInProgress: { $ref: '#/components/examples/RequestInProgress' }
            profileNotConfirmed:
              value:
                code: PROFILE_NOT_CONFIRMED
                message: 프로필을 먼저 확정해 주세요.
                request_id: req_01JABCDXYZ
    PayloadTooLarge:
      description: 요청 크기 초과 (JSON 64KiB, 녹음 6MiB)
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            tooLarge:
              value:
                code: PAYLOAD_TOO_LARGE
                message: 보낸 내용이 너무 큽니다.
                request_id: req_01JABCDXYZ
    ValidationFailed:
      description: 입력 형식·범위 오류
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            missingField:
              value:
                code: VALIDATION_FAILED
                message: 입력 내용을 확인해 주세요.
                request_id: req_01JABCDXYZ
                fields:
                  - path: source
                    reason: required
            unknownField:
              value:
                code: VALIDATION_FAILED
                message: 입력 내용을 확인해 주세요.
                request_id: req_01JABCDXYZ
                fields:
                  - path: owner_id
                    reason: unknown_field
    TooManyRequests:
      description: 호출·동시성 제한
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestId' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            rateLimited:
              value:
                code: RATE_LIMITED
                message: 요청이 많습니다. 잠시 후 다시 시도해 주세요.
                request_id: req_01JABCDXYZ
            dailyQuotaExceeded:
              value:
                code: DAILY_QUOTA_EXCEEDED
                message: 오늘 이용 한도를 모두 사용했습니다. 직접 입력이나 공고 탐색은 계속할 수 있습니다.
                request_id: req_01JABCDXYZ
            inferenceBusy:
              value:
                code: INFERENCE_BUSY
                message: 지금 처리 중인 요청이 많습니다. 잠시 후 다시 시도해 주세요.
                request_id: req_01JABCDXYZ
    ServiceUnavailable:
      description: 모델·내부 서비스 일시 장애
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestId' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            modelUnavailable:
              value:
                code: MODEL_UNAVAILABLE
                message: AI 기능을 잠시 쓸 수 없습니다. 직접 입력이나 공고 탐색은 계속할 수 있습니다.
                request_id: req_01JABCDXYZ
            aiTimeout:
              value:
                code: AI_TIMEOUT
                message: 처리 시간이 길어져 중단했습니다. 다시 시도하거나 직접 입력해 주세요.
                request_id: req_01JABCDXYZ
            serviceUnavailable:
              value:
                code: SERVICE_UNAVAILABLE
                message: 서비스를 잠시 쓸 수 없습니다. 잠시 후 다시 시도해 주세요.
                request_id: req_01JABCDXYZ

  examples:
    VersionConflict:
      value:
        code: VERSION_CONFLICT
        message: 정보가 변경되었습니다. 최신 내용을 확인해 주세요.
        request_id: req_01JABCDXYZ
    IdempotencyKeyReused:
      value:
        code: IDEMPOTENCY_KEY_REUSED
        message: 같은 요청 번호로 다른 내용을 보냈습니다. 화면을 새로 고친 뒤 다시 시도해 주세요.
        request_id: req_01JABCDXYZ
    RequestInProgress:
      value:
        code: REQUEST_IN_PROGRESS
        message: 앞선 요청을 처리하고 있습니다. 잠시 기다려 주세요.
        request_id: req_01JABCDXYZ
    OpportunityVolunteering:
      value:
        id: 6a5b4c3d-2e1f-4a0b-9c8d-7e6f5a4b3c2d
        version: 4
        title: 도서관 어르신 책 읽어주기 봉사
