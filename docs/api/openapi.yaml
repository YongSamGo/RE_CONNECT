  /admin/opportunities/{opportunity_id}/approve:
    post:
      tags: [운영자]
      operationId: approveOpportunity
      summary: 검수 대기 공고 승인·공개
      description: |
        `pending` → `approved`만 허용한다. `base_version`은 그 공고의 최신 버전이어야 한다.
        공개 필수 항목(제목·기관·지역 또는 원격·모집 상태·HTTPS 공식 원문·접수 경로)이 빠졌거나,
        원문 주소가 출처별 공식 상세 경로 허용표에 없거나, 마감이 지났거나 모집 종료면 422로 해당 필드를 알려 준다.
        수집기가 넣은 "필수조건 미검수" 표식 조건(근거가 `정규화 상태:`로 시작하는 `other`)이 남아 있어도 422(`content.requirements`)다.
        PATCH로 조건을 구조화하거나 "명시된 필수조건 없음"을 확인해 표식을 지운 새 버전을 승인한다.
        승인하면 이 버전이 공개본이 되고 검수 메모와 감사 기록을 남긴다. `rejected`·`hidden` 버전은 다시 승인하지 않는다.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/OpportunityId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpportunityApproveRequest' }
            examples:
              approve:
                value:
                  base_version: 5
                  note: 1365 원문과 마감일 변경 확인
      responses:
        '200':
          description: 승인 완료
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpportunityReviewResult' }
              examples:
                approved:
                  value:
                    id: 6a5b4c3d-2e1f-4a0b-9c8d-7e6f5a4b3c2d
                    version: 5
                    review_status: approved
                    reviewed_at: '2026-10-15T04:00:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422':
          description: 형식 오류·공개 필수 항목 누락
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                notPublishable:
                  value:
                    code: VALIDATION_FAILED
                    message: 공개에 필요한 항목이 비어 있습니다.
                    request_id: req_01JABCDXYZ
                    fields:
                      - path: content.activity_region
                        reason: required
