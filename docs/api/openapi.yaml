      properties:
        version: { type: string, pattern: '^[a-z0-9._-]{1,32}$', maxLength: 32 }
        title: { type: string, minLength: 1, maxLength: 200 }
        controller: { type: string, minLength: 1, maxLength: 200 }
        contact: { type: string, minLength: 1, maxLength: 300 }
        aws_region: { type: string, minLength: 1, maxLength: 100 }
        body: { type: string, minLength: 1, maxLength: 8000 }
        retention: { type: string, minLength: 1, maxLength: 2000 }
        deletion: { type: string, minLength: 1, maxLength: 2000 }
    NoticeCatalog:
      type: object
      additionalProperties: false
      required: [ai_processing, storage, login_available]
      properties:
        ai_processing:
          oneOf:
            - $ref: '#/components/schemas/PublishedNotice'
            - type: 'null'
        storage:
          oneOf:
            - $ref: '#/components/schemas/PublishedNotice'
            - type: 'null'
        login_available: { type: boolean }
    ErrorCode:
      type: string
