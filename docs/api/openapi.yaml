  /journeys:
    post:
      tags: [체험]
      operationId: createJourney
      summary: 체험 시작
      description: |
        먼저 `POST /consents`(purpose=ai_processing)로 동의를 기록한다. `ai_notice_version`이 동의한 현재 안내문 버전이 아니면 403 `CONSENT_REQUIRED`.

        - 회원이 `saved_profile`을 넘기면 그 저장본을 이 체험의 확정본 1번으로 가져온다. 비회원이 넘기면 401.
        - 체험은 생성 후 최대 2시간, 마지막 사용자 행동 후 30분이 지나면 만료된다. 자동 조회는 시간을 늘리지 않는다.
        - 비회원은 IP별, 회원은 계정별 하루 60회 생성 한도에 포함된다.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JourneyCreate' }
            examples:
              anonymous:
                summary: 비회원 시작
                value:
                  ai_notice_version: ai-2026-10-15
