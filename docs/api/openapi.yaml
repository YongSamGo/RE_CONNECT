openapi: 3.1.0
info:
  title: 다시잇다 API
  version: 1.2.0-draft.2
  summary: 프론트엔드·백엔드·모델 연동이 함께 쓰는 API 계약 (W01-02)
  description: |
    결정 기록과 공통 규칙은 docs/api/README.md를 본다. Plan/03 §3의 경로 46개를 모두 담았고,
    지역 목록·운영자 공고 상세·내부 health 경로가 더 있다. 화면은 이 파일에 있는 경로만 호출한다.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
    description: Nginx를 거친 공개 API
tags:
  - name: 인증·동의
    description: 세션 상태, 카카오 로그인, 로그인 저장 대기
  - name: 회원 저장
    description: 승인한 프로필·지원서의 암호화 저장
  - name: 체험
    description: 비회원·회원의 임시 체험(Redis)
  - name: 공고
    description: 공개 공고 조회
  - name: 읽어주기
    description: 화면에 보이는 자료의 한국어 음성
  - name: 운영자
    description: |
      운영자 역할과 이 세션의 MFA 확인이 필요한 관리 기능(`/admin/mfa/verify` 제외).
      상태를 바꾸는 연산은 모두 감사 기록(행위자·대상·이전/이후 상태·사유 코드)을 남긴다.
  - name: 내부 상태
    description: Compose 내부에서만 부르는 상태 확인

paths:
  /me:
    get:
      tags: [인증·동의]
      operationId: getMe
      summary: 현재 세션의 계정·권한·동의·저장 대기 상태
      description: |
        비회원 세션도 200을 돌려준다(`authenticated=false`). 화면은 시작할 때 이 경로를 불러
        CSRF 쿠키와 동의 상태를 받는다. 세션이 없으면 익명 세션 쿠키를, CSRF 쿠키가 없거나 세션과 맞지 않으면 새 CSRF 쿠키를 내려준다.
      security:
        - sessionCookie: []
        - {}
      responses:
        '200':
          description: 현재 상태
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookies' }
            X-Request-ID: { $ref: '#/components/headers/XRequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
              examples:
                anonymous:
                  summary: 비회원, AI 처리 동의함
                  value:
                    authenticated: false
                    user: null
                    consents:
                      - purpose: ai_processing
                        notice_version: ai-2026-10-15
                        granted_at: '2026-10-15T03:00:00Z'
                    pending_save_intent: null
                memberWithPendingSave:
                  summary: 로그인 직후, 저장 대기가 남아 있음
                  value:
                    authenticated: true
                    user:
                      id: 7d3c1d9e-3a52-4c55-9a43-2f1f6d1b8a10
                      roles: [user]
                      mfa_verified: false
                      reauth_until: null
                    consents:
                      - purpose: ai_processing
                        notice_version: ai-2026-10-15
                        granted_at: '2026-10-15T03:00:00Z'
                    pending_save_intent:
                      save_intent_id: 0b9f4c4e-2a1f-4d8e-9b7a-6c5d4e3f2a1b
                      expires_at: '2026-10-15T03:20:00Z'
                      targets:
                        profile: true
                        draft: true
                      existing_saved_profile_version: null
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      tags: [인증·동의]
      operationId: deleteAccount
      summary: 회원 탈퇴
      description: |
        `GET /auth/kakao/start?purpose=reauth`로 5분 안에 재인증한 세션만 가능하다(아니면 403 `REAUTH_REQUIRED`).
        세션·체험·계정 연결·동의·저장 프로필·지원서를 지우고 세션을 폐기한다. 최소 삭제 이력만 30일 남는다.
        삭제 요청을 영속화해 이전 인증을 차단한 뒤 DB 밖 최소 이력 저장·Redis 정리·SQL 삭제를 완료한다. 실패는 pending/failed 관리 재시도 대상이며 완료로 응답하지 않는다. 운영 이력 어댑터 미설정 시 실제 삭제 전에 503이다.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '204':
          description: 탈퇴 완료
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestId' }
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookies' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 재인증 필요·CSRF 실패
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                reauthRequired:
                  value:
                    code: REAUTH_REQUIRED
                    message: 탈퇴하려면 카카오 로그인으로 한 번 더 확인해 주세요.
                    request_id: req_01JABCDXYZ
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /auth/save-intents:
    post:
      tags: [인증·동의]
      operationId: createSaveIntent
      summary: 로그인 저장 대기 발급 (계획 §5 보완 계약)
      description: |
        비회원 세션이 소유한 체험의 확정 프로필·승인 지원서만 받는다. 서버가 그 승인본을 조회해
        Redis에 복사하고 10분 동안 이 세션에 결합한다. 같은 세션의 이전 저장 대기는 폐기한다.

        - 지원서를 담으려면 프로필도 함께 담아야 한다(비회원은 근거 프로필이 저장돼 있지 않다).
        - 이후 `GET /auth/kakao/start?purpose=save`로 로그인을 시작한다. URL에는 아무 참조도 넣지 않는다.
        - 회원 세션에서 부르면 409 `ALREADY_SIGNED_IN`이다. 회원은 체험 참조로 바로 저장한다.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveIntentCreate' }
            examples:
              profileAndDraft:
                summary: 프로필과 지원서를 함께 저장
                value:
                  journey_id: 3f6e2b1a-8c4d-4e5f-9a0b-1c2d3e4f5a6b
                  profile:
                    version: 2
                  draft:
                    draft_id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                    revision: 5
              profileOnly:
                summary: 프로필만 저장
                value:
                  journey_id: 3f6e2b1a-8c4d-4e5f-9a0b-1c2d3e4f5a6b
                  profile:
                    version: 2
                  draft: null
              missingProfile:
                summary: (오류 예제) 지원서만 담음 → 422
                value:
                  journey_id: 3f6e2b1a-8c4d-4e5f-9a0b-1c2d3e4f5a6b
                  profile: null
                  draft:
                    draft_id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                    revision: 5
      responses:
        '201':
          description: 저장 대기 발급
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaveIntent' }
              examples:
                created:
                  value:
                    save_intent_id: 0b9f4c4e-2a1f-4d8e-9b7a-6c5d4e3f2a1b
                    expires_at: '2026-10-15T03:20:00Z'
                    targets:
                      profile: true
                      draft: true
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 버전 충돌·미확정·미승인·회원 세션·멱등 키 충돌
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestId' }
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                versionConflict: { $ref: '#/components/examples/VersionConflict' }
                draftNotApproved:
                  value:
                    code: DRAFT_NOT_APPROVED
                    message: 승인한 지원서만 저장할 수 있습니다. 지원서를 확인하고 승인해 주세요.
                    request_id: req_01JABCDXYZ
                alreadySignedIn:
                  value:
                    code: ALREADY_SIGNED_IN
                    message: 이미 로그인되어 있습니다. 바로 저장할 수 있습니다.
                    request_id: req_01JABCDXYZ
                idempotencyKeyReused: { $ref: '#/components/examples/IdempotencyKeyReused' }
                requestInProgress: { $ref: '#/components/examples/RequestInProgress' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422':
          description: 형식 오류
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                nothingToSave:
                  summary: profile·draft가 모두 null
                  value:
                    code: VALIDATION_FAILED
                    message: 저장할 프로필이나 지원서를 선택해 주세요.
                    request_id: req_01JABCDXYZ
                    fields:
                      - path: profile
                        reason: required
                profileRequiredWithDraft:
                  value:
                    code: VALIDATION_FAILED
                    message: 입력 내용을 확인해 주세요.
                    request_id: req_01JABCDXYZ
                    fields:
                      - path: profile
                        reason: required_with
                missingJourney:
                  value:
                    code: VALIDATION_FAILED
                    message: 입력 내용을 확인해 주세요.
                    request_id: req_01JABCDXYZ
                    fields:
                      - path: journey_id
                        reason: required
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /auth/kakao/start:
    get:
      tags: [인증·동의]
      operationId: startKakaoLogin
      summary: 카카오 로그인 시작
      description: |
        브라우저 이동으로 부른다. GET이지만 OAuth state를 발급하므로 아래 규칙으로 보호한다.

        - 새 state(가능하면 PKCE `code_verifier` 포함)를 만들어 **현재 세션에 저장**한다. 1회용, 10분 만료.
          세션당 최대 3개를 두고 기존 state를 덮어쓰지 않는다(넘치면 가장 오래된 것부터 버린다).
          그래서 다른 사이트가 이 경로로 보내도 진행 중인 로그인·저장 흐름은 끊기지 않는다.
        - state에는 목적(`purpose`)만 기록한다. 저장 대기는 state가 아니라 세션에 결합돼 있다.
        - `purpose=reauth`는 로그인한 회원의 탈퇴 전 재인증이다. 비회원 세션이면 카카오로 가지 않고 `/auth/result?purpose=reauth&status=failed`로 보낸다.
        - `purpose=save`인데 세션에 저장 대기가 없거나 만료됐으면 카카오로 가지 않고 `/auth/result?purpose=save&status=expired`로 보낸다.
        - 세션이 없으면 익명 세션을 만든다.
      security:
        - sessionCookie: []
        - {}
      parameters:
        - name: purpose
          in: query
          required: true
          schema:
            type: string
            enum: [login, save, reauth]
      responses:
        '302':
          description: 카카오 인가 페이지 또는 화면 결과 경로로 이동
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookies' }
            Location:
              description: 카카오 인가 URL, `/auth/result?purpose=save&status=expired`, 또는 `/auth/result?purpose=reauth&status=failed`
              schema: { type: string }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /auth/kakao/callback:
    get:
      tags: [인증·동의]
      operationId: kakaoCallback
      summary: 카카오 인가 결과 처리
      description: |
        카카오가 보내는 GET이라 CSRF 헤더 대신 세션 결합 state로 보호한다(로그인 CSRF 방지).

        - 쿼리 `state`가 **요청 세션에 저장된 state**와 같을 때만 처리하고, 쓴 state는 바로 지운다.
          세션이 없거나, 다른 세션이 발급한 state이거나, 만료·재사용이면 카카오 토큰 교환을 하지 않고 `status=failed`로 보낸다.
        - `login`·`save`가 성공하면 세션을 교체(새 세션·새 CSRF 쿠키)하고, 시작 세션의 저장 대기를 새 세션으로 옮긴 뒤 시작 세션의 진행 중 체험을 지운다(새 세션으로 옮기지 않는다).
        - `reauth`는 세션을 교체하지 않는다. 지금 로그인한 계정과 같은 카카오 계정이면 5분 동안 재인증 상태(`GET /me`의 `user.reauth_until`)가 되고, 다른 계정이면 세션을 그대로 두고 `status=failed`로 보낸다.
        - 인증 성공만으로 자료를 저장하지 않는다.
        - 결과는 항상 화면의 `/auth/result`로 보내며 code·state·오류 설명을 Location에 남기지 않는다.
      security:
        - sessionCookie: []
      parameters:
        - { name: code, in: query, required: false, schema: { type: string, maxLength: 512 } }
        - { name: state, in: query, required: false, schema: { type: string, maxLength: 256 } }
        - { name: error, in: query, required: false, schema: { type: string, maxLength: 64 } }
        - { name: error_description, in: query, required: false, schema: { type: string, maxLength: 512 } }
      responses:
        '302':
          description: 화면 결과 경로로 이동
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookies' }
            Location:
              description: |
                `/auth/result?purpose={login|save|reauth}&status={success|cancelled|failed|expired}`
              schema: { type: string }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/save-intents/{save_intent_id}:
    delete:
      tags: [인증·동의]
      operationId: cancelSaveIntent
      summary: 현재 세션의 저장 대기 취소
      description: |
        비회원 또는 회원의 현재 세션에 결합된 정확한 대기만 폐기한다.
        이미 취소·소비·만료됐거나 다른 세션의 ID여도 204이며 타인의 대기에는 영향이 없다.
        회원 저장과 같은 소유자 잠금으로 직렬화한다. 먼저 끝난 저장본은 되돌리지 않는다.
        저장 동의를 철회하거나 로그인·체험·이미 저장한 자료를 삭제하지 않는다.
        쿼리와 본문은 허용하지 않는다.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: save_intent_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: 현재 세션의 일치하는 대기 폐기 또는 이미 없음
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /profiles/me/versions:
    post:
      tags: [회원 저장]
      operationId: saveProfileVersion
      summary: 확정 프로필을 새 저장 버전으로 저장
      description: |
        회원은 체험 참조(`source.type=journey`)로, 로그인 왕복 직후에는 저장 대기(`source.type=save_intent`)로 저장한다.

        - 저장 동의가 없으면 403 `CONSENT_REQUIRED`.
        - 기존 저장본이 있으면 `base_saved_version`에 그 버전을 넣어 교체를 확인한다. 저장본이 없으면 `null`.
        - 현재 저장본과 내용이 같으면 새 버전을 만들지 않고 200으로 그 버전을 돌려준다.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileSaveRequest' }
            examples:
              fromSaveIntent:
                summary: 로그인 왕복 직후
                value:
                  source:
                    type: save_intent
                    save_intent_id: 0b9f4c4e-2a1f-4d8e-9b7a-6c5d4e3f2a1b
                  base_saved_version: null
              fromJourney:
                summary: 회원이 기존 저장본을 교체
                value:
                  source:
                    type: journey
                    journey_id: 3f6e2b1a-8c4d-4e5f-9a0b-1c2d3e4f5a6b
                    version: 3
                  base_saved_version: 1
      responses:
        '200':
          description: 같은 내용의 저장본이 있어 그 버전을 연결
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileSaveResult' }
              examples:
                reused:
                  value:
                    version: 1
                    saved_at: '2026-10-14T09:00:00Z'
                    created: false
                    replaced_version: null
        '201':
          description: 새 저장 버전
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileSaveResult' }
              examples:
                created:
                  value:
                    version: 2
                    saved_at: '2026-10-15T03:12:00Z'
                    created: true
                    replaced_version: 1
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /drafts:
    get:
      tags: [회원 저장]
      operationId: listSavedDrafts
      summary: 자기 저장 지원서 목록
      description: 최근 저장 순이다. 근거 프로필·공고가 바뀐 문서는 `review_reasons`가 붙는다.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
