        - SESSION_EXPIRED
        - FORBIDDEN
        - CSRF_FAILED
        - MFA_REQUIRED
        - MFA_INVALID
        - MFA_LOCKED
        - CONSENT_REQUIRED
        - REAUTH_REQUIRED
        - NOT_FOUND
        - SAVE_INTENT_NOT_FOUND
        - VERSION_CONFLICT
        - IDEMPOTENCY_KEY_REUSED
        - REQUEST_IN_PROGRESS
        - REQUEST_ALREADY_COMPLETED
        - PROFILE_NOT_CONFIRMED
        - PROFILE_NOT_SAVED
        - DRAFT_NOT_APPROVED
        - OPPORTUNITY_NOT_AVAILABLE
        - INVALID_STATE_TRANSITION
        - ALREADY_SIGNED_IN
        - PAYLOAD_TOO_LARGE
        - VALIDATION_FAILED
        - RATE_LIMITED
        - DAILY_QUOTA_EXCEEDED
        - INFERENCE_BUSY
        - INTERNAL_ERROR
        - MODEL_UNAVAILABLE
        - AI_TIMEOUT
        - SERVICE_UNAVAILABLE

    Error:
      type: object
      description: 모든 오류의 공통 본문. 원본 입력·SQL·토큰·파일 경로·예외 추적을 넣지 않는다
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message:
          type: string
          maxLength: 200
          description: 사용자에게 보여 줄 한국어 문장
        request_id:
          type: string
          pattern: '^req_[0-9A-Za-z]{10,32}$'
          description: 서버가 붙인 추적 ID. 클라이언트 멱등 키와 다르다
        fields:
          type: array
          description: 422에만 붙는다
          maxItems: 50
          items: { $ref: '#/components/schemas/FieldError' }

    FieldError:
      type: object
      additionalProperties: false
      required: [path, reason]
      properties:
        path:
          type: string
          maxLength: 200
          description: 점 경로. 예 `profile.preferred_regions[0].district`
        reason:
          type: string
          enum: [required, invalid_type, invalid_value, too_long, too_short, out_of_range, unknown_field, required_with]

    ConsentPurpose:
      type: string
      enum: [ai_processing, storage]
      description: ai_processing = EC2 자체 AI 처리(대화·음성·읽어주기), storage = 회원 영구 저장

    ConsentState:
      type: object
      additionalProperties: false
      required: [purpose, notice_version, granted_at]
      properties:
        purpose: { $ref: '#/components/schemas/ConsentPurpose' }
        notice_version:
          type: string
          pattern: '^[a-z0-9._-]{1,32}$'
        granted_at: { type: string, format: date-time }

    Me:
      type: object
      additionalProperties: false
      required: [authenticated, user, consents, pending_save_intent]
      properties:
        authenticated: { type: boolean }
        user:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [id, roles, mfa_verified, reauth_until]
              properties:
                id: { type: string, format: uuid }
                roles:
                  type: array
                  items: { type: string, enum: [user, operator] }
                mfa_verified:
                  type: boolean
                  description: 운영자 MFA를 이 세션에서 완료했는지. 일반 사용자는 항상 false
                reauth_until:
                  type: [string, 'null']
                  format: date-time
                  description: 탈퇴 전 재인증이 유효한 시각. 재인증하지 않았거나 지났으면 null
        consents:
          type: array
          description: 현재 유효한 동의만. 철회·폐기 버전은 빠진다
          items: { $ref: '#/components/schemas/ConsentState' }
        pending_save_intent:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/PendingSaveIntent'

    SaveIntentCreate:
      type: object
      additionalProperties: false
      required: [journey_id, profile, draft]
      description: |
        profile·draft 중 하나 이상. draft가 있으면 profile도 필수.
        둘 다 null이면 422 `fields: [{path: profile, reason: required}]`, draft만 있으면 422 `fields: [{path: profile, reason: required_with}]`.
      not:
        description: profile·draft가 모두 null이면 거절
        properties:
          profile: { type: 'null' }
          draft: { type: 'null' }
      properties:
        journey_id: { type: string, format: uuid }
        profile:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [version]
              properties:
                version:
                  type: integer
                  minimum: 1
                  description: 이 체험의 확정 프로필 버전
        draft:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [draft_id, revision]
              properties:
                draft_id: { type: string, format: uuid }
                revision:
                  type: integer
                  minimum: 1
                  description: 승인한 임시 지원서의 리비전

    SaveIntentTargets:
      type: object
      additionalProperties: false
      required: [profile, draft]
      properties:
        profile: { type: boolean }
        draft: { type: boolean }

    SaveIntent:
      type: object
      additionalProperties: false
      required: [save_intent_id, expires_at, targets]
      properties:
        save_intent_id:
          type: string
          format: uuid
          description: opaque 참조. URL에 넣지 않는다
        expires_at:
          type: string
          format: date-time
          description: 발급 후 10분
        targets: { $ref: '#/components/schemas/SaveIntentTargets' }

    PendingSaveIntent:
      type: object
      additionalProperties: false
      required: [save_intent_id, expires_at, targets, existing_saved_profile_version]
      properties:
        save_intent_id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
        targets: { $ref: '#/components/schemas/SaveIntentTargets' }
        existing_saved_profile_version:
          type: [integer, 'null']
          minimum: 1
          description: 로그인한 회원의 현재 저장 프로필 버전. 있으면 화면이 교체 여부를 묻고 base_saved_version으로 보낸다

    SaveIntentSource:
      type: object
      additionalProperties: false
      required: [type, save_intent_id]
      properties:
        type: { type: string, const: save_intent }
        save_intent_id: { type: string, format: uuid }

    JourneyProfileSource:
      type: object
      additionalProperties: false
      required: [type, journey_id, version]
      properties:
        type: { type: string, const: journey }
        journey_id: { type: string, format: uuid }
        version:
          type: integer
          minimum: 1
          description: 체험의 확정 프로필 버전

    JourneyDraftSource:
      type: object
      additionalProperties: false
      required: [type, journey_id, draft_id, revision]
      properties:
        type: { type: string, const: journey }
        journey_id: { type: string, format: uuid }
        draft_id: { type: string, format: uuid }
        revision:
          type: integer
          minimum: 1
          description: 승인한 임시 지원서의 리비전

    ProfileSaveRequest:
      type: object
      additionalProperties: false
      required: [source, base_saved_version]
      properties:
        source:
          oneOf:
            - $ref: '#/components/schemas/SaveIntentSource'
            - $ref: '#/components/schemas/JourneyProfileSource'
          discriminator:
            propertyName: type
            mapping:
              save_intent: '#/components/schemas/SaveIntentSource'
              journey: '#/components/schemas/JourneyProfileSource'
        base_saved_version:
          type: [integer, 'null']
          minimum: 1
          description: 교체할 현재 저장본 버전. 저장본이 없으면 null. 최신이 아니면 409

    ProfileSaveResult:
      type: object
      additionalProperties: false
      required: [version, saved_at, created, replaced_version]
      properties:
        version: { type: integer, minimum: 1 }
        saved_at: { type: string, format: date-time }
        created:
          type: boolean
          description: false면 같은 내용의 기존 저장본을 연결했다
        replaced_version: { type: [integer, 'null'], minimum: 1 }

    DraftSaveRequest:
      type: object
      additionalProperties: false
      required: [source, document_id, base_document_version]
      properties:
        source:
          oneOf:
            - $ref: '#/components/schemas/SaveIntentSource'
            - $ref: '#/components/schemas/JourneyDraftSource'
          discriminator:
            propertyName: type
            mapping:
              save_intent: '#/components/schemas/SaveIntentSource'
              journey: '#/components/schemas/JourneyDraftSource'
        document_id:
          type: [string, 'null']
          format: uuid
          description: 기존 저장 문서를 갱신할 때만. base_document_version과 함께 보낸다
        base_document_version:
          type: [integer, 'null']
          minimum: 1

    DraftSaveResult:
      type: object
      additionalProperties: false
      required: [document_id, version, saved_at, profile_version]
      properties:
        document_id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        saved_at: { type: string, format: date-time }
        profile_version:
          type: integer
          minimum: 1
          description: 연결한 회원 저장 프로필 버전

    RoleId:
      type: string
      pattern: '^[a-z][a-z0-9_]{1,63}$'
      description: 역할 사전(RoleDefinition)의 키. 공고 role_tags도 같은 키를 쓴다

    RoleExclusionUpdate:
      type: object
      additionalProperties: false
      required: [role_ids, base_revision]
      properties:
        role_ids:
          type: array
          maxItems: 50
          uniqueItems: true
          items: { $ref: '#/components/schemas/RoleId' }
        base_revision: { type: integer, minimum: 1 }

    RoleExclusions:
      type: object
      additionalProperties: false
      required: [role_ids, revision]
      properties:
        role_ids:
          type: array
          items: { $ref: '#/components/schemas/RoleId' }
        revision: { type: integer, minimum: 1 }

    SpeechRequest:
      type: object
      additionalProperties: false
      required: [target, segment]
      properties:
        target: { $ref: '#/components/schemas/SpeechTarget' }
        segment:
          type: integer
          minimum: 0
          maximum: 9
          description: 2,000자 단위 조각 번호(0부터). 응답 헤더 X-Speech-Segment-Count를 넘으면 422

    SpeechTarget:
      description: 화면에 보이는 자료의 참조. 대상마다 읽을 수 있는 필드가 정해져 있다
      oneOf:
        - $ref: '#/components/schemas/SpeechTargetJourneyMessage'
        - $ref: '#/components/schemas/SpeechTargetJourneyDraft'
        - $ref: '#/components/schemas/SpeechTargetSavedDraft'
        - $ref: '#/components/schemas/SpeechTargetOpportunity'
      discriminator:
        propertyName: kind
        mapping:
          journey_message: '#/components/schemas/SpeechTargetJourneyMessage'
          journey_draft: '#/components/schemas/SpeechTargetJourneyDraft'
          saved_draft: '#/components/schemas/SpeechTargetSavedDraft'
          opportunity: '#/components/schemas/SpeechTargetOpportunity'

    SpeechTargetJourneyMessage:
      type: object
      additionalProperties: false
      required: [kind, journey_id, message_id]
      properties:
        kind: { type: string, const: journey_message }
        journey_id: { type: string, format: uuid }
        message_id:
          type: string
          format: uuid
          description: 체험의 AI 질문 메시지

    SpeechTargetJourneyDraft:
      type: object
      additionalProperties: false
      required: [kind, journey_id, draft_id, revision, field]
      properties:
        kind: { type: string, const: journey_draft }
        journey_id: { type: string, format: uuid }
        draft_id: { type: string, format: uuid }
        revision: { type: integer, minimum: 1 }
        field: { type: string, enum: [self_introduction, motivation] }

    SpeechTargetSavedDraft:
      type: object
      additionalProperties: false
      required: [kind, document_id, version, field]
      properties:
        kind: { type: string, const: saved_draft }
        document_id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        field: { type: string, enum: [self_introduction, motivation] }

    SpeechTargetOpportunity:
      type: object
      additionalProperties: false
      required: [kind, opportunity_id, version, field]
      properties:
        kind: { type: string, const: opportunity }
        opportunity_id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        field:
          type: string
          enum: [title, description_text, schedule_text, location_text, compensation_text, application_instructions]

    OpportunityRejectRequest:
      type: object
      additionalProperties: false
      required: [base_version, reason_code, note]
      properties:
        base_version:
          type: integer
          minimum: 1
          description: 검수 중인 pending 버전
        reason_code:
          type: string
          enum:
            - source_unverifiable
            - out_of_scope
            - recruitment_closed
            - duplicate
            - insufficient_information
            - inappropriate_content
            - other
          description: |
            source_unverifiable 공식 원문·접수 경로 확인 불가, out_of_scope 지역·유형 범위 밖,
            recruitment_closed 이미 모집 종료, duplicate 같은 공고가 이미 있음,
            insufficient_information 필수 정보 부족, inappropriate_content 부적절한 내용, other 기타(메모 필수)
        note:
          type: [string, 'null']
          minLength: 1
          maxLength: 500
          description: 개인정보를 적지 않는다

    OpportunityReviewResult:
      type: object
      additionalProperties: false
      required: [id, version, review_status, reviewed_at]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        review_status: { type: string, enum: [pending, approved, rejected, hidden] }
        reviewed_at: { type: string, format: date-time }

    Province:
      type: string
      enum: [seoul, gyeonggi, incheon]

    Region:
      type: object
      additionalProperties: false
      required: [province, district]
      properties:
        province: { $ref: '#/components/schemas/Province' }
        district:
          type: [string, 'null']
          pattern: '^[a-z0-9_]{2,40}$'
          description: 서버 지역 목록의 시·군·구 식별값. null이면 시·도 전체

    Requirement:
      type: object
      additionalProperties: false
      required: [id, field, operator, value, group_id, group_operator, reference_date, source_evidence, clarity]
      description: |
        필드별 허용 연산과 값 (Plan/02 §4 표와 같다):

        | field | operator | value |
        |---|---|---|
        | age | gte, lte | integer (만 나이) |
        | age | between | [min, max] integer 2개 |
        | residence_region | in | Region[] |
        | certification, completed_course | has_all, has_any | string[] |
        | weekday | includes_all, includes_any | integer[] (1=월 ~ 7=일) |
        | hours_per_week | gte, lte | number |
        | other | null | null (clarity=needs_review) |

        표에 없는 조합은 422. 해석하지 못한 조건은 field=other, clarity=needs_review와 원문 근거로 보존한다.
      properties:
        id: { type: string, format: uuid }
        field:
          type: string
          enum: [age, residence_region, certification, completed_course, weekday, hours_per_week, other]
        operator:
          type: [string, 'null']
          enum: [gte, lte, between, in, has_all, has_any, includes_all, includes_any, null]
        value: { $ref: '#/components/schemas/RequirementValue' }
        group_id: { type: [string, 'null'], format: uuid }
        group_operator:
          type: [string, 'null']
          enum: [and, or, null]
        reference_date:
          type: [string, 'null']
          format: date
          description: 연령 등 판정 기준일
        source_evidence:
          type: string
          maxLength: 1000
          description: 원문 조건 문장
        clarity: { type: string, enum: [clear, needs_review] }

    Opportunity:
      type: object
      description: 공개 공고 상세. 내부 필드(source_id, external_id, content_hash, review_status)는 내보내지 않는다
      additionalProperties: false
      required:
        - id
        - version
        - title
        - organization_name
        - activity_type
        - is_public_job
        - role_tags
        - skill_tags
        - activity_region
        - location_text
        - remote_allowed
        - schedule_text
        - hours_per_week
        - paid
        - compensation_text
        - description_text
        - description_truncated
        - requirements
        - required_documents
        - application_method
        - application_instructions
        - source_url
        - application_url
        - deadline_date
        - deadline_at
        - recruitment_status
        - source_checked_at
        - reviewed_at
        - change_pending
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        title: { type: string, maxLength: 200 }
        organization_name: { type: string, maxLength: 200 }
        activity_type: { type: string, enum: [employment, volunteering] }
        is_public_job: { type: [boolean, 'null'] }
        role_tags:
          type: array
          items: { $ref: '#/components/schemas/RoleId' }
        skill_tags:
          type: array
          items: { type: string, maxLength: 50 }
        activity_region:
          description: 원격이 아닌 공고의 활동 지역. 모르면 null(지역 기준 추천에서 제외)
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Region'
        location_text: { type: [string, 'null'], maxLength: 500 }
        remote_allowed: { type: [boolean, 'null'] }
        schedule_text: { type: [string, 'null'], maxLength: 500 }
        hours_per_week: { type: [number, 'null'], minimum: 0, maximum: 168 }
        paid: { type: [boolean, 'null'] }
        compensation_text: { type: [string, 'null'], maxLength: 500 }
        description_text:
          type: [string, 'null']
          maxLength: 5000
          description: |
            공식 원문 설명(일반 텍스트). 검색 계산과 상세 표시에 쓰고 검수 대상이다.
            값이 없으면 null이며 설명을 만들어 채우지 않는다
        description_truncated:
          type: boolean
          description: 원문이 5,000자를 넘어 앞부분만 저장했으면 true
        requirements:
          type: array
          description: 빈 배열은 "명시된 필수조건 없음"으로 검수한 상태
          items: { $ref: '#/components/schemas/Requirement' }
        required_documents:
          type: [array, 'null']
          items: { type: string, maxLength: 200 }
        application_method: { type: string, enum: [online, phone, visit, email, mixed] }
        application_instructions: { type: string, maxLength: 2000 }
        source_url: { type: string, format: uri, pattern: '^https://' }
        application_url: { type: string, format: uri, pattern: '^https://' }
        deadline_date:
          type: [string, 'null']
          format: date
          description: 날짜만 제공된 마감. 시각을 만들어 붙이지 않는다
        deadline_at:
          type: [string, 'null']
          format: date-time
          description: 공식 시각이 제공된 경우에만
        recruitment_status: { type: string, enum: [open, closed, unknown] }
        source_checked_at: { type: string, format: date-time }
        reviewed_at: { type: string, format: date-time }
        change_pending:
          type: boolean
          description: 중요 변경이 검수 대기 중. true면 화면에 "변경 확인 중"을 표시하고 추천·지원서 생성을 보류한다

    Readiness:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status: { type: string, enum: [ready, degraded, unavailable] }
        checks:
          type: object
          additionalProperties: false
          required: [db, redis, llm, speech]
          properties:
            db: { type: string, enum: [ok, fail] }
            redis: { type: string, enum: [ok, fail] }
            llm: { type: string, enum: [ok, fail] }
            speech: { type: string, enum: [ok, fail] }

    RequirementValue:
      description: Requirement 연산별 값. 허용 조합은 Requirement 설명의 표를 따른다
      oneOf:
        - type: 'null'
        - type: number
        - type: array
          items: { type: number }
          minItems: 1
          maxItems: 7
        - type: array
          items: { type: string, maxLength: 100 }
          minItems: 1
          maxItems: 20
        - type: array
          items: { $ref: '#/components/schemas/Region' }
          minItems: 1
          maxItems: 30

    RegionCatalog:
      type: object
      additionalProperties: false
      required: [version, provinces]
      properties:
        version:
          type: string
          maxLength: 32
          description: 지역 목록 버전. 목록이 바뀌면 올라간다
        provinces:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, districts]
            properties:
              id: { $ref: '#/components/schemas/Province' }
              name: { type: string, maxLength: 20 }
              districts:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [id, name]
                  properties:
                    id: { type: string, pattern: '^[a-z0-9_]{2,40}$' }
                    name: { type: string, maxLength: 20 }

    Experience:
      type: object
      additionalProperties: false
      required: [id, description, skill_tags, duration_note]
      properties:
        id:
          type: string
          format: uuid
          description: 서버가 부여한 경험 ID
        description: { type: string, minLength: 1, maxLength: 1000 }
        skill_tags:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 50 }
        duration_note:
          type: [string, 'null']
          maxLength: 200
          description: 사용자가 말한 기간. 불명확하면 추정하지 않고 null

    ExperienceInput:
      type: object
      additionalProperties: false
      required: [id, description, skill_tags, duration_note]
      properties:
        id:
          type: [string, 'null']
          format: uuid
          description: 기존 경험은 서버가 부여한 ID, 새 경험은 null
        description: { type: string, minLength: 1, maxLength: 1000 }
        skill_tags:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 50 }
        duration_note:
          type: [string, 'null']
          maxLength: 200
          description: 사용자가 말한 기간. 불명확하면 추정하지 않고 null

    ProfileContent:
      type: object
      description: |
        Plan/02 §2 프로필 계약. null은 미확인, 빈 배열은 "없다고 확인함"이다.
        예외로 experiences·preferred_regions·activity_types의 빈 배열은 "아직 입력하지 않음"이며 missing_for_recommendation으로 다시 묻는다.
        추천을 시작하려면 확정본에 experiences·preferred_regions·activity_types가 1개 이상 있어야 한다.
      additionalProperties: false
      required:
        - schema_version
        - experiences
        - skills
        - preferred_regions
        - activity_types
        - paid_preference
        - available_weekdays
        - hours_per_week
        - mobility_note
        - residence_region
        - birth_year
        - certifications
        - completed_courses
        - activity_constraints
      properties:
        schema_version: { type: integer, const: 1 }
        experiences:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/Experience' }
        skills:
          type: array
          maxItems: 30
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 50 }
        preferred_regions:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/Region' }
        activity_types:
          type: array
          maxItems: 2
          uniqueItems: true
          items: { type: string, enum: [employment, volunteering] }
        paid_preference:
          type: [string, 'null']
          enum: [paid, unpaid, any, null]
        available_weekdays:
          type: [array, 'null']
          maxItems: 7
          uniqueItems: true
          items: { type: integer, minimum: 1, maximum: 7 }
          description: 1=월 ~ 7=일
        hours_per_week: { type: [number, 'null'], minimum: 0, maximum: 168 }
        mobility_note: { type: [string, 'null'], maxLength: 300 }
        residence_region:
          description: 거주 자격 대조용. 희망 활동 지역과 다르다
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Region'
        birth_year: { type: [integer, 'null'], minimum: 1900, maximum: 2026 }
        certifications:
          type: [array, 'null']
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 100 }
        completed_courses:
          type: [array, 'null']
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 100 }
        activity_constraints:
          type: [array, 'null']
          maxItems: 10
          description: 활동 수행 조건. 진단명·상세 병력은 받지 않는다
          items: { type: string, minLength: 1, maxLength: 200 }

    ProfileContentInput:
      type: object
      description: |
        프로필 초안 수정 요청용. ProfileContent와 같고, 새 경험만 id를 null로 보낸다.
        추천을 시작하려면 확정본에 experiences·preferred_regions·activity_types가 1개 이상 있어야 한다.
      additionalProperties: false
      required:
        - schema_version
        - experiences
        - skills
        - preferred_regions
        - activity_types
        - paid_preference
        - available_weekdays
        - hours_per_week
        - mobility_note
        - residence_region
        - birth_year
        - certifications
        - completed_courses
        - activity_constraints
      properties:
        schema_version: { type: integer, const: 1 }
        experiences:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/ExperienceInput' }
        skills:
          type: array
          maxItems: 30
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 50 }
        preferred_regions:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/Region' }
        activity_types:
          type: array
          maxItems: 2
          uniqueItems: true
          items: { type: string, enum: [employment, volunteering] }
        paid_preference:
          type: [string, 'null']
          enum: [paid, unpaid, any, null]
        available_weekdays:
          type: [array, 'null']
          maxItems: 7
          uniqueItems: true
          items: { type: integer, minimum: 1, maximum: 7 }
          description: 1=월 ~ 7=일
        hours_per_week: { type: [number, 'null'], minimum: 0, maximum: 168 }
        mobility_note: { type: [string, 'null'], maxLength: 300 }
        residence_region:
          description: 거주 자격 대조용. 희망 활동 지역과 다르다
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Region'
        birth_year: { type: [integer, 'null'], minimum: 1900, maximum: 2026 }
        certifications:
          type: [array, 'null']
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 100 }
        completed_courses:
          type: [array, 'null']
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 100 }
        activity_constraints:
          type: [array, 'null']
          maxItems: 10
          description: 활동 수행 조건. 진단명·상세 병력은 받지 않는다
          items: { type: string, minLength: 1, maxLength: 200 }

    ProfileEvidence:
      type: object
      additionalProperties: false
      required: [path, message_ids]
      description: 초안 항목이 어느 대화 메시지에서 나왔는지. 확정본·저장본에는 복제하지 않는다
      properties:
        path: { type: string, maxLength: 200, description: '예: experiences[0]' }
        message_ids:
          type: array
          minItems: 1
          items: { type: string, format: uuid }

    ConfirmedVersion:
      type: object
      additionalProperties: false
      required: [version, confirmed_at]
      properties:
        version: { type: integer, minimum: 1 }
        confirmed_at: { type: string, format: date-time }

    ProfileDraftView:
      type: object
      additionalProperties: false
      required: [revision, draft, evidence, confirmed, has_unconfirmed_changes, missing_for_recommendation]
      properties:
        revision:
          type: integer
          minimum: 1
          description: 체험 리비전(편집 상태 변경 번호). 변경 요청의 base_revision으로 쓴다
        draft: { $ref: '#/components/schemas/ProfileContent' }
        evidence:
          type: array
          items: { $ref: '#/components/schemas/ProfileEvidence' }
        confirmed:
          description: 현재 확정본. 아직 없으면 null
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ConfirmedVersion'
        has_unconfirmed_changes:
          type: boolean
          description: 확정 후 수정한 내용이 있어 재확정이 필요하면 true. 이때 추천은 이전 확정본 기준이다
        missing_for_recommendation:
          type: array
          description: 추천 시작에 필요한데 비어 있는 항목
          items: { type: string, enum: [experiences, preferred_regions, activity_types] }

    ProfileRef:
      type: object
      additionalProperties: false
      required: [kind, id, version]
      description: 확정 프로필 참조. 클라이언트가 프로필 본문을 보내 확정 검사를 우회할 수 없다
      properties:
        kind:
          type: string
          enum: [journey, saved]
          description: journey = 체험의 확정본(id는 체험 ID), saved = 회원 저장본(id는 저장 프로필 ID)
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }

    OpportunityRef:
      type: object
      additionalProperties: false
      required: [id, version]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }

    Message:
      type: object
      additionalProperties: false
      required: [message_id, text, created_at]
      properties:
        message_id: { type: string, format: uuid }
        text: { type: string, maxLength: 2000 }
        created_at: { type: string, format: date-time }

    JourneyCreate:
      type: object
      additionalProperties: false
      required: [ai_notice_version, saved_profile]
      properties:
        ai_notice_version:
          type: string
          pattern: '^[a-z0-9._-]{1,32}$'
          description: 사용자가 동의한 AI 처리 안내문 버전
        saved_profile:
          description: 회원이 자기 저장 프로필로 시작할 때만. 비회원은 null
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [profile_id, version]
              properties:
                profile_id: { type: string, format: uuid }
                version: { type: integer, minimum: 1 }

    Journey:
      type: object
      additionalProperties: false
      required: [journey_id, revision, expires_at, idle_expires_at, first_message, confirmed]
      properties:
        journey_id: { type: string, format: uuid }
        revision: { type: integer, minimum: 1 }
        expires_at:
          type: string
          format: date-time
          description: 생성 후 2시간. 활동으로 늘어나지 않는다
        idle_expires_at:
          type: string
          format: date-time
          description: 마지막 사용자 행동 후 30분
        first_message: { $ref: '#/components/schemas/Message' }
        confirmed:
          description: 저장 프로필로 시작했으면 확정본 1번, 아니면 null
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ConfirmedVersion'

    Transcription:
      type: object
      additionalProperties: false
      required: [transcription_id, text, duration_seconds]
      properties:
        transcription_id: { type: string, format: uuid }
        text:
          type: string
          maxLength: 2000
          description: 사용자가 확인·수정한 뒤 messages로 보낸다. 원본 음성은 보관하지 않는다
        duration_seconds: { type: number, minimum: 0, maximum: 90 }

    MessageCreate:
      type: object
      additionalProperties: false
      required: [text, transcription_id, base_revision]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
          description: 사용자가 확인한 텍스트. 전사 결과를 고쳤다면 고친 내용
        transcription_id:
          type: [string, 'null']
          format: uuid
          description: 음성 입력이면 전사 ID, 직접 입력이면 null
        base_revision: { type: integer, minimum: 1 }

    MessageResult:
      type: object
      additionalProperties: false
      required: [revision, user_message_id, assistant_message, profile, notices, next_step]
      properties:
        revision: { type: integer, minimum: 1 }
        user_message_id: { type: string, format: uuid }
        assistant_message:
          description: 다음 질문. 더 물을 것이 없으면 null
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Message'
        profile: { $ref: '#/components/schemas/ProfileDraftView' }
        notices:
          type: array
          maxItems: 10
          description: 사용자에게 보여 줄 주의사항(예. 건강 상세 정보는 저장하지 않음)
          items: { type: string, maxLength: 300 }
        next_step:
          type: string
          enum: [continue, review_profile]

    ProfileUpdate:
      type: object
      additionalProperties: false
      required: [draft, base_revision]
      description: 초안 전체를 바꾼다. 새 경험은 id를 null로 보낸다
      properties:
        draft: { $ref: '#/components/schemas/ProfileContentInput' }
        base_revision: { type: integer, minimum: 1 }

    BaseRevision:
      type: object
      additionalProperties: false
      required: [base_revision]
      properties:
        base_revision: { type: integer, minimum: 1 }

    ProfileConfirmResult:
      type: object
      additionalProperties: false
      required: [profile, confirmed_at, revision]
      properties:
        profile: { $ref: '#/components/schemas/ProfileRef' }
        confirmed_at: { type: string, format: date-time }
        revision: { type: integer, minimum: 1 }

    RoleCandidate:
      type: object
      additionalProperties: false
      required: [role_id, name, description, evidence, excluded]
      properties:
        role_id: { $ref: '#/components/schemas/RoleId' }
        name: { type: string, maxLength: 50 }
        description: { type: string, maxLength: 300 }
        evidence:
          type: array
          minItems: 1
          description: 이 역할과 연결한 확정 경험. 근거가 없는 역할은 후보로 내지 않는다
          items:
            type: object
            additionalProperties: false
            required: [experience_id, skill_tags]
            properties:
              experience_id: { type: string, format: uuid }
              skill_tags:
                type: array
                items: { type: string, maxLength: 50 }
        excluded: { type: boolean }

    RoleCandidates:
      type: object
      additionalProperties: false
      required: [profile_version, items, revision]
      properties:
        profile_version: { type: integer, minimum: 1 }
        items:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/RoleCandidate' }
        revision: { type: integer, minimum: 1 }

    RecommendationRequest:
      type: object
      additionalProperties: false
      required: [profile, filters]
      properties:
        profile: { $ref: '#/components/schemas/ProfileRef' }
        filters:
          type: object
          additionalProperties: false
          description: 선택 필터. 프로필 조건을 좁히기만 하고 필수조건을 완화하지 않는다
          properties:
            activity_types:
              type: array
              minItems: 1
              uniqueItems: true
              items: { type: string, enum: [employment, volunteering] }
            regions:
              type: array
              minItems: 1
              maxItems: 10
              items: { $ref: '#/components/schemas/Region' }
            paid: { type: boolean }

    OpportunitySummary:
      type: object
      additionalProperties: false
      required:
        - id
        - version
        - title
        - organization_name
        - activity_type
        - is_public_job
        - activity_region
        - remote_allowed
        - paid
        - deadline_date
        - deadline_at
        - recruitment_status
        - change_pending
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        title: { type: string, maxLength: 200 }
        organization_name: { type: string, maxLength: 200 }
        activity_type: { type: string, enum: [employment, volunteering] }
        is_public_job: { type: [boolean, 'null'] }
        activity_region:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Region'
        remote_allowed: { type: [boolean, 'null'] }
        paid: { type: [boolean, 'null'] }
        deadline_date: { type: [string, 'null'], format: date }
        deadline_at: { type: [string, 'null'], format: date-time }
        recruitment_status: { type: string, enum: [open, closed, unknown] }
        change_pending: { type: boolean }

    OpportunityList:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/OpportunitySummary' }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 20 }
        total: { type: integer, minimum: 0 }

    EligibilityStatus:
      type: string
      enum: [satisfied, not_satisfied, unknown]
      description: satisfied 조건 충족, not_satisfied 미충족, unknown 확인 필요

    EligibilityUserValue:
      description: 비교한 확정 프로필 값. null은 미확인, 빈 배열은 없음 확인이며 거주지는 단일 Region이다
      anyOf:
        - type: 'null'
        - type: number
        - $ref: '#/components/schemas/Region'
        - type: array
          maxItems: 7
          items: { type: number }
        - type: array
          maxItems: 20
          items: { type: string, maxLength: 100 }

    EligibilitySummary:
      type: object
      additionalProperties: false
      required: [overall, needs_review_count, no_requirements]
      properties:
        overall: { $ref: '#/components/schemas/EligibilityStatus' }
        needs_review_count: { type: integer, minimum: 0 }
        no_requirements:
          type: boolean
          description: 원문에 필수조건이 없다고 검수한 공고. 선발을 보장한다는 뜻이 아니다

    Recommendation:
      type: object
      additionalProperties: false
      required: [rank, opportunity, matched, eligibility]
      description: 내부 정렬 점수는 내보내지 않는다. 신청 성공 확률로 표현하지 않는다
      properties:
        rank: { type: integer, minimum: 1 }
        opportunity: { $ref: '#/components/schemas/OpportunitySummary' }
        matched:
          type: object
          additionalProperties: false
          required: [experience_ids, skill_tags, keywords, role_ids]
          properties:
            experience_ids:
              type: array
              minItems: 1
              items: { type: string, format: uuid }
            skill_tags:
              type: array
              items: { type: string, maxLength: 50 }
            keywords:
              type: array
              items: { type: string, maxLength: 50 }
            role_ids:
              type: array
              items: { $ref: '#/components/schemas/RoleId' }
        eligibility: { $ref: '#/components/schemas/EligibilitySummary' }

    RecommendationList:
      type: object
      additionalProperties: false
      required: [profile, generated_at, based_on_previous_confirmed, items]
      properties:
        profile: { $ref: '#/components/schemas/ProfileRef' }
        generated_at: { type: string, format: date-time }
        based_on_previous_confirmed:
          type: boolean
          description: 프로필을 수정 중이라 이전 확정본 기준이면 true. 화면에 "이전 확정 프로필 기준"을 표시한다
        items:
          type: array
          maxItems: 20
          description: 정렬 순서대로. 화면은 상위 5건을 먼저 보여 준다. 0건이어도 필수조건을 완화하지 않는다
          items: { $ref: '#/components/schemas/Recommendation' }

    EligibilityRequest:
      type: object
      additionalProperties: false
      required: [profile, opportunity_version]
      properties:
        profile: { $ref: '#/components/schemas/ProfileRef' }
        opportunity_version:
          type: integer
          minimum: 1
          description: 화면에 보이는 공고 버전. 최신 공개본이 아니면 409

    EligibilityResult:
      type: object
      additionalProperties: false
      required: [profile, opportunity, overall, no_requirements, conditions, groups, evaluated_at]
      properties:
        profile: { $ref: '#/components/schemas/ProfileRef' }
        opportunity: { $ref: '#/components/schemas/OpportunityRef' }
        overall: { $ref: '#/components/schemas/EligibilityStatus' }
        no_requirements: { type: boolean }
        conditions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [requirement_id, field, result, user_value, source_evidence, review_reason]
            properties:
              requirement_id: { type: string, format: uuid }
              field:
                type: string
                enum: [age, residence_region, certification, completed_course, weekday, hours_per_week, other]
              result: { $ref: '#/components/schemas/EligibilityStatus' }
              user_value:
                description: 비교한 사용자 값. 프로필에 없으면 null
                $ref: '#/components/schemas/EligibilityUserValue'
              source_evidence: { type: string, maxLength: 1000 }
              review_reason:
                type: [string, 'null']
                enum: [missing_profile_value, unclear_requirement, age_boundary, reference_date_missing, unsupported_group, null]
                description: result=unknown일 때 확인이 필요한 이유
        groups:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [group_id, operator, result]
            properties:
              group_id: { type: string, format: uuid }
              operator: { type: string, enum: [and, or] }
              result: { $ref: '#/components/schemas/EligibilityStatus' }
        evaluated_at: { type: string, format: date-time }

    Preparation:
      type: object
      additionalProperties: false
      required:
        - opportunity
        - application_method
        - application_instructions
        - application_url
        - source_url
        - required_documents
        - deadline_date
        - deadline_at
        - recruitment_status
        - change_pending
      description: 공식 서류·절차·접수 안내. 공고에 없는 서류를 더하지 않는다. 외부 이동은 신청 완료가 아니다
      properties:
        opportunity: { $ref: '#/components/schemas/OpportunityRef' }
        application_method: { type: string, enum: [online, phone, visit, email, mixed] }
        application_instructions: { type: string, maxLength: 2000 }
        application_url: { type: string, format: uri, pattern: '^https://' }
        source_url: { type: string, format: uri, pattern: '^https://' }
        required_documents:
          type: [array, 'null']
          description: null이면 공고에 제출 서류가 명시되지 않음
          items: { type: string, maxLength: 200 }
        deadline_date: { type: [string, 'null'], format: date }
        deadline_at: { type: [string, 'null'], format: date-time }
        recruitment_status: { type: string, enum: [open, closed, unknown] }
        change_pending: { type: boolean }

    DraftCreate:
      type: object
      additionalProperties: false
      required: [profile_version, opportunity, mode, saved_document]
      properties:
        profile_version:
          type: integer
          minimum: 1
          description: 이 체험의 확정 프로필 버전
        opportunity: { $ref: '#/components/schemas/OpportunityRef' }
        mode:
          type: string
          enum: [generate, manual, from_saved]
          description: generate = 로컬 AI 초안(AI 동의 필요), manual = 빈 초안(AI 호출 없음), from_saved = 자기 저장 문서 가져오기
        saved_document:
          description: mode=from_saved일 때만. 그 밖에는 null
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [document_id, version]
              properties:
                document_id: { type: string, format: uuid }
                version: { type: integer, minimum: 1 }

    DraftUpdate:
      type: object
      additionalProperties: false
      required: [self_introduction, motivation, base_revision]
      description: 본문 전체를 바꾼다. 수정하면 승인이 풀린다
      properties:
        self_introduction: { type: string, maxLength: 2000 }
        motivation: { type: string, maxLength: 2000 }
        base_revision: { type: integer, minimum: 1 }

    ReviewReason:
      type: string
      enum: [profile_changed, opportunity_changed, opportunity_closed]
      description: profile_changed 근거 프로필이 재확정됨, opportunity_changed 공고 중요 변경, opportunity_closed 모집 종료·비공개

    JourneyDraft:
      type: object
      additionalProperties: false
      required:
        - draft_id
        - revision
        - mode
        - profile_version
        - opportunity
        - self_introduction
        - motivation
        - approved_at
        - review_reasons
        - warnings
      properties:
        draft_id: { type: string, format: uuid }
        revision: { type: integer, minimum: 1 }
        mode: { type: string, enum: [generate, manual, from_saved] }
        profile_version: { type: integer, minimum: 1 }
        opportunity: { $ref: '#/components/schemas/OpportunityRef' }
        self_introduction: { type: string, maxLength: 2000 }
        motivation: { type: string, maxLength: 2000 }
        approved_at:
          type: [string, 'null']
          format: date-time
          description: 사용자 승인 시각. 미승인·수정 후에는 null
        review_reasons:
          type: array
          description: 비어 있지 않으면 화면에 재검토 필요를 표시한다
          items: { $ref: '#/components/schemas/ReviewReason' }
        warnings:
          type: array
          maxItems: 10
          description: 근거 검증에서 뺀 문장 등 사용자에게 알릴 내용
          items: { type: string, maxLength: 300 }

    ConsentCreate:
      type: object
      additionalProperties: false
      required: [purpose, notice_version]
      properties:
        purpose: { $ref: '#/components/schemas/ConsentPurpose' }
        notice_version:
          type: string
          pattern: '^[a-z0-9._-]{1,32}$'
          description: 화면에 보여 준 안내문 버전. 현재 버전이 아니면 422

    ConsentWithdraw:
      type: object
      additionalProperties: false
      required: [purpose]
      properties:
        purpose: { $ref: '#/components/schemas/ConsentPurpose' }

    ConsentWithdrawResult:
      type: object
      additionalProperties: false
      required: [purpose, withdrawn_at, deleted]
      properties:
        purpose: { $ref: '#/components/schemas/ConsentPurpose' }
        withdrawn_at: { type: string, format: date-time }
        deleted:
          type: object
          additionalProperties: false
          required: [journeys, profile_versions, documents]
          description: 철회와 함께 지운 자료 수. ai_processing은 진행 중 체험, storage는 저장 프로필·지원서
          properties:
            journeys: { type: integer, minimum: 0 }
            profile_versions: { type: integer, minimum: 0 }
            documents: { type: integer, minimum: 0 }

    SavedProfile:
      type: object
      additionalProperties: false
      required: [profile_id, version, confirmed_at, saved_at, content]
      properties:
        profile_id:
          type: string
          format: uuid
          description: ProfileRef(kind=saved)의 id
        version: { type: integer, minimum: 1 }
        confirmed_at: { type: string, format: date-time }
        saved_at: { type: string, format: date-time }
        content: { $ref: '#/components/schemas/ProfileContent' }

    SavedProfileResponse:
      type: object
      additionalProperties: false
      required: [saved]
      properties:
        saved:
          description: 저장본이 없으면 null
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/SavedProfile'

    SavedDraftSummary:
      type: object
      additionalProperties: false
      required: [document_id, version, opportunity, opportunity_title, organization_name, saved_at, review_reasons]
      properties:
        document_id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        opportunity: { $ref: '#/components/schemas/OpportunityRef' }
        opportunity_title: { type: string, maxLength: 200 }
        organization_name: { type: string, maxLength: 200 }
        saved_at: { type: string, format: date-time }
        review_reasons:
          type: array
          items: { $ref: '#/components/schemas/ReviewReason' }

    SavedDraftList:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/SavedDraftSummary' }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 20 }
        total: { type: integer, minimum: 0 }

    SavedDraft:
      type: object
      additionalProperties: false
      required:
        - document_id
        - version
        - profile_version
        - opportunity
        - opportunity_title
        - organization_name
        - self_introduction
        - motivation
        - approved_at
        - saved_at
        - review_reasons
      properties:
        document_id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        profile_version: { type: integer, minimum: 1 }
        opportunity: { $ref: '#/components/schemas/OpportunityRef' }
        opportunity_title: { type: string, maxLength: 200 }
        organization_name: { type: string, maxLength: 200 }
        self_introduction: { type: string, maxLength: 2000 }
        motivation: { type: string, maxLength: 2000 }
        approved_at: { type: string, format: date-time }
        saved_at: { type: string, format: date-time }
        review_reasons:
          type: array
          items: { $ref: '#/components/schemas/ReviewReason' }

    ReportCreate:
      type: object
      additionalProperties: false
      required: [opportunity, type, note]
      properties:
        opportunity: { $ref: '#/components/schemas/OpportunityRef' }
        type: { $ref: '#/components/schemas/ReportType' }
        note:
          type: [string, 'null']
          maxLength: 500
          description: 선택 설명. 개인정보를 적지 않도록 화면에서 안내한다. type=other이면 필수

    ReportType:
      type: string
      enum: [already_closed, wrong_requirements, wrong_schedule_or_location, wrong_application_method, broken_link, other]

    ReportReceipt:
      type: object
      additionalProperties: false
      required: [report_id, received_at]
      properties:
        report_id: { type: string, format: uuid }
        received_at: { type: string, format: date-time }

    MfaVerify:
      type: object
      additionalProperties: false
      required: [otp]
      properties:
        otp: { type: string, pattern: '^[0-9]{6}$' }

    MfaStatus:
      type: object
      additionalProperties: false
      required: [mfa_verified, expires_at]
      properties:
        mfa_verified: { type: boolean, const: true }
        expires_at:
          type: string
          format: date-time
          description: 이 세션의 MFA 확인 만료 시각

    OpportunityInput:
      type: object
      description: 운영자가 등록·수정하는 공고 내용. 저장하면 새 pending 버전이 되고 승인 전에는 공개되지 않는다
      additionalProperties: false
      required:
        - title
        - organization_name
        - activity_type
        - is_public_job
        - role_tags
        - skill_tags
        - activity_region
        - location_text
        - remote_allowed
        - schedule_text
        - hours_per_week
        - paid
        - compensation_text
        - description_text
        - requirements
        - required_documents
        - application_method
        - application_instructions
        - source_url
        - application_url
        - deadline_date
        - deadline_at
        - recruitment_status
      properties: &opportunity-input-properties
        title: { type: string, minLength: 1, maxLength: 200 }
        organization_name: { type: string, minLength: 1, maxLength: 200 }
        activity_type: { type: string, enum: [employment, volunteering] }
        is_public_job: { type: [boolean, 'null'] }
        role_tags:
          type: array
          maxItems: 10
          uniqueItems: true
          items: { $ref: '#/components/schemas/RoleId' }
        skill_tags:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 50 }
        activity_region:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Region'
        location_text: { type: [string, 'null'], maxLength: 500 }
        remote_allowed: { type: [boolean, 'null'] }
        schedule_text: { type: [string, 'null'], maxLength: 500 }
        hours_per_week: { type: [number, 'null'], minimum: 0, maximum: 168 }
        paid: { type: [boolean, 'null'] }
        compensation_text: { type: [string, 'null'], maxLength: 500 }
        description_text: { type: [string, 'null'], maxLength: 5000 }
        requirements:
          type: array
          maxItems: 30
          description: 새 조건의 id는 클라이언트가 UUID로 만든다
          items: { $ref: '#/components/schemas/Requirement' }
        required_documents:
          type: [array, 'null']
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 200 }
        application_method: { type: string, enum: [online, phone, visit, email, mixed] }
        application_instructions: { type: string, minLength: 1, maxLength: 2000 }
        source_url: { type: string, format: uri, pattern: '^https://', maxLength: 2000 }
        application_url: { type: string, format: uri, pattern: '^https://', maxLength: 2000 }
        deadline_date: { type: [string, 'null'], format: date }
        deadline_at: { type: [string, 'null'], format: date-time }
        recruitment_status: { type: string, enum: [open, closed, unknown] }

    OpportunityPatch:
      type: object
      additionalProperties: false
      required: [base_version, changes]
      properties:
        base_version:
          type: integer
          minimum: 1
          description: 수정 기준 버전(현재 최신 버전). 최신이 아니면 409
        changes:
          type: object
          additionalProperties: false
          minProperties: 1
          description: 바꿀 필드만. 형식은 OpportunityInput과 같다
          properties: *opportunity-input-properties

    AdminOpportunity:
      type: object
      additionalProperties: false
      required:
        - id
        - version
        - review_status
        - published_version
        - source
        - changed_fields
        - important_change
        - content
        - published_content
        - source_checked_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        version:
          type: integer
          minimum: 1
          description: 최신 버전(검수 대상). 검수 요청의 base_version으로 쓴다
        review_status: { type: string, enum: [pending, approved, rejected, hidden] }
        published_version:
          type: [integer, 'null']
          minimum: 1
          description: 현재 공개 중인 버전. 없으면 null
        source:
          type: object
          additionalProperties: false
          required: [source_id, name, external_id]
          properties:
            source_id: { type: string, format: uuid }
            name: { type: string, maxLength: 100 }
            external_id: { type: [string, 'null'], maxLength: 100 }
        changed_fields:
          type: array
          description: 공개본 대비 바뀐 필드. 공개본이 없으면 빈 배열
          items: { type: string, maxLength: 50 }
        important_change:
          type: boolean
          description: 중요 변경 필드가 바뀌었는지(docs/api/README.md §2.7). true면 공개본 추천을 보류 중이다
        content: { $ref: '#/components/schemas/OpportunityInput' }
        published_content:
          description: 비교용 공개본 내용. 공개본이 없으면 null
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/OpportunityInput'
        source_checked_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AdminOpportunitySummary:
      type: object
      additionalProperties: false
      required: [id, version, title, organization_name, review_status, recruitment_status, published_version, important_change, source_checked_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        title: { type: string, maxLength: 200 }
        organization_name: { type: string, maxLength: 200 }
        review_status: { type: string, enum: [pending, approved, rejected, hidden] }
        recruitment_status: { type: string, enum: [open, closed, unknown] }
        published_version: { type: [integer, 'null'], minimum: 1 }
        important_change: { type: boolean }
        source_checked_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AdminOpportunityList:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/AdminOpportunitySummary' }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 20 }
        total: { type: integer, minimum: 0 }

    OpportunityApproveRequest:
      type: object
      additionalProperties: false
      required: [base_version, note]
      properties:
        base_version: { type: integer, minimum: 1 }
        note:
          type: string
          minLength: 1
          maxLength: 500
          description: 검수 사유(확인한 원문·변경 내용). 개인정보를 적지 않는다

    OpportunityHideRequest:
      type: object
      additionalProperties: false
      required: [base_version, note]
      properties:
        base_version: { type: integer, minimum: 1 }
        note: { type: string, minLength: 1, maxLength: 500 }

    OpportunityCloseRequest:
      type: object
      additionalProperties: false
      required: [base_version, basis, note]
      properties:
        base_version: { type: integer, minimum: 1 }
        basis:
          type: string
          enum: [source_closed, deadline_passed, organization_notice, report_confirmed, other]
          description: 모집 종료 근거
        note:
          type: [string, 'null']
          minLength: 1
          maxLength: 500
          description: basis=other이면 필수. 개인정보를 적지 않는다

    Operations:
      type: object
      additionalProperties: false
      required: [sources, models, stores, limits, checked_at]
      properties:
        sources:
          type: [array, 'null']
          description: 사용 중인 출처. DB를 읽지 못하면 null이다.
          items:
            type: object
            additionalProperties: false
            required: [source_id, name, last_run_at, last_success_at, last_status, last_failure_code, running, consecutive_failures, stale]
            properties:
              source_id: { type: string, format: uuid }
              name: { type: string, minLength: 1, maxLength: 200 }
              last_run_at:
                type: [string, 'null']
                format: date-time
                description: 마지막으로 끝난 실행의 종료 시각. 실행 중인 것은 포함하지 않는다.
              last_success_at: { type: [string, 'null'], format: date-time }
              last_status:
                type: [string, 'null']
                enum: [success, partial, failed, null]
                description: |
                  마지막으로 끝난 실행의 결과. `partial`은 일부만 받고 멈춘 실패(`budget_exhausted`·`incomplete`)다.
                  실행 기록이 없으면 null이다.
              last_failure_code:
                type: [string, 'null']
                enum: [network, parse, response_limit, source_unavailable, cancelled, invalid_payload, budget_exhausted, incomplete, configuration, null]
                description: 마지막으로 끝난 실행이 실패했을 때의 고정 실패 코드. 성공했거나 기록이 없으면 null이다.
              running:
                type: boolean
                description: 지금 실행 중인 수집이 있음
              consecutive_failures:
                type: integer
                minimum: 0
                description: 마지막 성공 이후 실패한 실행 수(`partial` 포함)
              stale:
                type: boolean
                description: |
                  출처의 마지막 성공이 48시간을 넘었거나 성공한 적이 없음. 추천 보류는 출처가 아니라
                  공고마다 마지막 확인 시각으로 판정하므로, 이 값이 곧 그 출처 공고 전체의 보류를 뜻하지는 않는다.
        models:
          type: object
          additionalProperties: false
          required: [llm, stt, tts]
          properties:
            llm: { $ref: '#/components/schemas/ComponentState' }
            stt: { $ref: '#/components/schemas/ComponentState' }
            tts: { $ref: '#/components/schemas/ComponentState' }
        stores:
          type: object
          additionalProperties: false
          required: [db, redis]
          properties:
            db: { $ref: '#/components/schemas/ComponentState' }
            redis: { $ref: '#/components/schemas/ComponentState' }
        limits:
          type: [object, 'null']
          description: 공유 추론 제어 상태. Redis를 읽지 못했거나 제어 상태가 준비되지 않았으면 null이다.
          additionalProperties: false
          required: [inference_today, inference_daily_limit, slots_in_use, slots_total]
          properties:
            inference_today: { type: integer, minimum: 0 }
            inference_daily_limit: { type: integer, minimum: 0 }
            slots_in_use: { type: integer, minimum: 0 }
            slots_total: { type: integer, minimum: 0 }
        checked_at: { type: string, format: date-time }

    ComponentState:
      type: string
      enum: [ok, loading, fail]
      description: |
        모델은 공유 추론 제어(Redis)와 런타임이 모두 준비돼야 `ok`다. `loading`은 런타임이 적재 중을
        알려 줄 때만 쓰며, 지금 음성 서비스·Ollama는 알려 주지 않아 `ok`·`fail`만 나온다.

    AdminReport:
      type: object
      additionalProperties: false
      required: [report_id, version, opportunity, opportunity_title, type, note, status, resolution_note, created_at, updated_at]
      properties:
        report_id: { type: string, format: uuid }
        version:
          type: integer
          minimum: 1
          description: 처리 요청의 base_version으로 쓴다
        opportunity: { $ref: '#/components/schemas/OpportunityRef' }
        opportunity_title: { type: string, maxLength: 200 }
        type: { $ref: '#/components/schemas/ReportType' }
        note: { type: [string, 'null'], maxLength: 500 }
        status: { $ref: '#/components/schemas/ReportStatus' }
        resolution_note: { type: [string, 'null'], maxLength: 500 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ReportStatus:
      type: string
      enum: [received, in_progress, resolved, dismissed]

    AdminReportList:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/AdminReport' }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 20 }
        total: { type: integer, minimum: 0 }

    ReportUpdate:
      type: object
      additionalProperties: false
      required: [base_version, status, resolution_note]
      properties:
        base_version: { type: integer, minimum: 1 }
        status:
          type: string
          enum: [in_progress, resolved, dismissed]
        resolution_note:
          type: [string, 'null']
          maxLength: 500
          description: resolved·dismissed이면 필수

    AuditEvent:
      type: object
      additionalProperties: false
      required: [event_id, at, actor_id, actor_role, action, target_type, target_id, result, request_id]
      description: 최소 메타데이터만. 개인 프로필·지원서 본문, OTP, 토큰은 넣지 않는다
      properties:
        event_id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        actor_id: { type: [string, 'null'], format: uuid }
        actor_role: { type: string, enum: [operator, user, system] }
        action:
          type: string
          enum:
            - opportunity.create
            - opportunity.update
            - opportunity.approve
            - opportunity.reject
            - opportunity.hide
            - opportunity.close
            - report.update
            - mfa.verify
            - mfa.fail
            - mfa.lock
            - mfa.enroll
            - mfa.reset
            - role.grant
            - role.revoke
            - access.denied
        target_type: { type: [string, 'null'], enum: [opportunity, report, user, null] }
        target_id: { type: [string, 'null'], format: uuid }
        result: { type: string, enum: [success, denied, failed] }
        request_id: { type: string, pattern: '^req_[0-9A-Za-z]{10,32}$' }

    AuditList:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/AuditEvent' }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 20 }
        total: { type: integer, minimum: 0 }
