                        opportunity: { id: 6a5b4c3d-2e1f-4a0b-9c8d-7e6f5a4b3c2d, version: 4 }
                        opportunity_title: 도서관 어르신 책 읽어주기 봉사
                        organization_name: 용산구립도서관
                        saved_at: '2026-10-15T03:31:00Z'
                        review_reasons: []
                    page: 1
                    page_size: 20
                    total: 1
