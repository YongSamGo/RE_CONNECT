                  transcription_id: null
                  base_revision: 2
              emptyText:
                summary: (오류 예제) 빈 텍스트 → 422
                value:
                  text: ''
                  transcription_id: null
                  base_revision: 2
      responses:
        '200':
          description: 다음 질문과 갱신된 초안
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestId' }
