<script>
'use strict';
const D=JSON.parse(document.getElementById('guide-data').textContent);
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const views=[['overview','전체 흐름 이해'],['architecture','구조와 책임'],['execution','실행 단계 따라가기'],['features','기능별 구현 상태'],['security','보안 경계 확인'],['decisions','결정할 일과 순서']];
const S={view:'overview',mode:'as-is',archTab:'structure',node:'api',flow:0,step:0,error:false,feature:'전체',featureOpen:null,decision:'D8',choices:{},tags:['정리','안내'],sourceReturn:null};
const statusNames=['전체','구현 및 검증 완료','구현됐으나 미검증','부분 구현','Mock / Stub','설계만 존재','확인 불가','범위 제외'];
const badge=s=>`<span class="badge ${/부분|미검증|확인 불가|목표|중단/.test(s)?'warn':/범위|설계/.test(s)?'neutral':''}">${esc(s)}</span>`;
const head=(id,title,body)=>`<header><h1 id="title-${id}">${title}</h1><p class="intro">${body}</p></header>`;
const nodeName=id=>D.components.find(n=>n.id===id)?.name??'운영자 MFA · 검수 API';
const shortNames={ui:'사용자 화면',edge:'HTTPS 진입',api:'API 서버',journey:'체험·프로필·초안',match:'역할·추천·자격',content:'공고·수집',member:'회원·저장·삭제',redis:'임시 상태',sql:'영구 자료',llm:'모델·음성',external:'외부 서비스',admin:'운영자·검수'};
const refs=keys=>`<div class="evidence-actions"><button class="evidence-button" data-evidence="${keys.join(',')}">코드 근거 ${keys.length}개 보기</button></div>`;
const chips=ids=>`<div class="component-chips">${ids.map(id=>`<button data-node="${id}">${esc(shortNames[id])}</button>`).join('')}</div>`;
function navigate(view,focus=true){
 if(!views.some(v=>v[0]===view))view='overview';S.view=view;
 document.querySelectorAll('.view').forEach(e=>e.hidden=e.id!==`view-${view}`);
 document.querySelectorAll('.navbtn').forEach(e=>{e.setAttribute('aria-pressed',String(e.dataset.view===view));e.setAttribute('aria-current',e.dataset.view===view?'page':'false')});
 if(location.protocol==='file:'){if(location.hash!==`#${view}`)location.hash=view}else history.replaceState(null,'',`#${view}`);
 document.title=`${views.find(v=>v[0]===view)[1]} · 다시잇다`;
 if(focus){$('workspace').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'})}
}
function openDialog(title,body,opener){
 S.sourceReturn=opener??document.activeElement;$('dialog-title').textContent=title;$('dialog-content').innerHTML=body;$('dialog-shell').hidden=false;
 document.querySelector('.shell').inert=true;document.body.style.overflow='hidden';$('close-dialog').focus();
}
function closeDialog(){
 $('dialog-shell').hidden=true;document.querySelector('.shell').inert=false;document.body.style.overflow='';
 if(S.sourceReturn?.isConnected)S.sourceReturn.focus({preventScroll:true});S.sourceReturn=null;
}
function sourceEntries(keys){return keys.map((key,i)=>{const r=D.sources[key];return `<details class="source-entry" ${keys.length===1?'open':''}><summary>${i+1}. ${esc(r.label)}<span class="source-path">${esc(r.path)} · ${r.line}행</span></summary><pre>${esc(r.snippet)}</pre><p class="quiet">전체 파일을 당시 커밋에서 확인하는 명령</p><pre class="ref-command">git show ${D.meta.commit.slice(0,8)}:${esc(r.path)}</pre></details>`}).join('')}
function openEvidence(keys,opener){openDialog('코드 근거',`<p class="snapshot-label">분석 커밋 ${D.meta.commit.slice(0,8)}의 코드 발췌입니다. 현재 작업 폴더가 다른 브랜치라면 파일 내용·위치가 달라질 수 있습니다.</p>${sourceEntries(keys)}`,opener)}
function baseline(){
 const b=D.meta.baseline;
 openDialog('어느 코드가 분석 기준인가요?',`<p><strong>main에 병합된 코드만을 기준으로 만든 자료가 아닙니다.</strong> 최초 분석 당시의 로컬 작업 브랜치를 분석했습니다.</p><div class="baseline-grid"><div class="baseline-ref"><strong>원격 main</strong><code>${b.main.slice(0,8)}</code><p>기획·문서가 있는 기준입니다.<br>backend·frontend·speech·infra 경로의 추적 파일은 0개입니다.</p></div><div class="baseline-ref"><strong>원격 develop</strong><code>${b.develop.slice(0,8)}</code><p>2026-10-25에 다시 가져온 최신 통합 기준입니다. 분석 스냅샷과 ${b.behindDevelop}개 develop 커밋이 서로 다릅니다.</p></div><div class="baseline-ref snapshot"><strong>이 자료의 분석 커밋</strong><code>${D.meta.commit.slice(0,8)}</code><p>${esc(D.meta.branch)}<br>당시 로컬 구현·로컬 시험을 포함합니다.</p></div></div><div class="note warn"><p>분석 커밋에만 있는 커밋은 main 대비 <strong>${b.aheadMain}개</strong>, develop 대비 <strong>${b.aheadDevelop}개</strong>입니다. main에는 없고 분석 커밋에는 있는 네 실행 경로의 변경 파일은 <strong>${b.runtimeChangedFromMain}개</strong>입니다.</p></div><p>분석 커밋은 main의 조상이 아닙니다. main에는 이 프로젝트의 backend·frontend·speech·infra 추적 파일이 없어, main만으로 실제 구현 흐름과 테스트 상태를 분석할 수 없습니다.</p><p class="quiet">비교 확인일: ${esc(b.checkedAt)}. main 기준으로 다시 분석한 자료는 아니며, 이번 수정에서도 원래 분석 기준과 당시 시험 결과를 유지했습니다. 현재 작업 폴더가 다른 브랜치여도 이 자료의 기준은 바뀌지 않습니다.</p><pre>git rev-list --left-right --count origin/develop...${D.meta.commit.slice(0,8)}\ngit ls-tree -r --name-only origin/main -- backend frontend speech infra</pre>`,$('show-baseline'));
}
function overview(){
 $('view-overview').innerHTML=head('overview','경험을 확인하고, 참여 기회로 연결합니다','시스템의 중심은 사용자가 확정한 경험입니다. AI의 제안, 확정된 프로필, 공개 공고, 승인한 지원서는 서로 다른 상태로 관리합니다.')+
 `<div class="journey-map" aria-label="서비스의 세 구간"><button class="journey-stage" data-flow="0"><strong>1. 경험을 정리합니다</strong><span>대화 → AI 초안 → 사용자 수정·확정</span></button><button class="journey-stage" data-flow="1"><strong>2. 기회를 비교합니다</strong><span>역할 탐색 → 추천 → 자격조건 대조</span></button><button class="journey-stage" data-flow="2"><strong>3. 신청을 준비합니다</strong><span>지원서 승인 → 공식 신청처 직접 이동</span></button></div>
 <div class="two-col section"><div><h2>현재 코드를 이해하는 핵심</h2><ul class="summary-list"><li><h3>화면 연습과 실제 체험이 나뉩니다</h3><p>미리보기는 브라우저 메모리만 사용합니다. 실제 체험 화면은 서버 API를 호출하며, 게시된 처리 안내가 없으면 시작할 수 없습니다.</p></li><li><h3>추천은 근거를 계산합니다</h3><p>현재는 태그·키워드로 순위를 정합니다. 자격 미충족 공고는 먼저 제외하고, 정보가 부족한 조건은 “확인 필요”로 남깁니다.</p></li><li><h3>확정과 저장은 다른 단계입니다</h3><p>프로필 확정만으로 영구 저장하지 않습니다. 로그인과 별도 저장 동의를 거쳐 승인 자료를 저장합니다.</p></li></ul></div>

function decisions(){
 $('view-decisions').innerHTML=head('decisions','제품 범위와 다음 개발 순서를 결정합니다','분석 권고이며 아직 승인된 결정은 아닙니다. 우선순위 P0·P1·P2는 코드 리뷰의 심각도와 다릅니다.')+
 `<div><h2>권장 선행 순서</h2><div class="dependency"><button data-decision="D8">MVP 범위</button><span aria-hidden="true">→</span><button data-decision="D1">운영 안내</button><span aria-hidden="true">→</span><button data-decision="D2">검수·공고</button><span aria-hidden="true">→</span><button data-decision="D3">실제 한 여정</button><span aria-hidden="true">→</span><button data-decision="D6">회원·복구</button></div><p class="quiet section">검색 평가는 공고 확보 후, 모델·음성 실측은 합의된 범위에서 병렬로 진행할 수 있습니다.</p></div><div id="decision-list" class="section">${[...D.decisions].sort((a,b)=>a.id==='D8'?-1:b.id==='D8'?1:0).map(d=>`<article class="decision" id="decision-${d.id}"><button class="decision-question" data-decision="${d.id}" aria-expanded="${S.decision===d.id}" aria-controls="decision-body-${d.id}"><span><span class="badge ${d.priority==='P0'?'warn':''}">${d.priority}</span>${esc(d.question)}</span><span aria-hidden="true">${S.decision===d.id?'−':'＋'}</span></button><div class="decision-body" id="decision-body-${d.id}" ${S.decision!==d.id?'hidden':''}><p>${esc(d.situation)}</p><h3 class="section">대안 선택</h3><div class="decision-tabs">${d.options.map((o,i)=>`<button data-choice="${d.id}:${i}" aria-pressed="${(S.choices[d.id]??0)===i}">${esc(o[0])}</button>`).join('')}</div>${d.options.map((o,i)=>`<div class="option ${(S.choices[d.id]??0)===i?'selected':''}" ${(S.choices[d.id]??0)!==i?'hidden':''}><p>${esc(o[1])}</p></div>`).join('')}<div class="note"><h3>권장안</h3><p>${esc(d.recommend)}</p></div><h3>결정의 영향</h3><p>${esc(d.impact)}</p><p class="quiet">담당 제안: ${esc(d.owner)}<br>선행 항목: ${esc(d.needs.join(', ')||'없음')}</p>${refs(d.refs)}</div></article>`).join('')}</div><div class="view-footer"><a href="decision-log.md">의사결정 전체 기록</a> · <a href="implementation-status.md">작업별 완료 조건</a></div>`;
}
function renderSearch(){const q=$('search').value.trim().toLocaleLowerCase();if(!q){$('searchresults').hidden=true;return}
 const sources=Object.entries(D.sources).filter(([,r])=>(r.path+' '+r.label).toLocaleLowerCase().includes(q));const fs=D.features.filter(f=>(f.id+' '+f.name+' '+f.dep).toLocaleLowerCase().includes(q));
 $('searchresults').hidden=false;$('searchresults').innerHTML=`<div class="row between"><strong>기능 ${fs.length}개 · 소스 근거 ${sources.length}개</strong><button id="close-search">닫기</button></div>${fs.map(f=>`<button class="result" data-feature-result="${f.id}">${esc(f.name)}<span class="source-path">${esc(f.state)}</span></button>`).join('')}${sources.map(([key,r])=>`<button class="result" data-evidence="${key}">${esc(r.label)}<span class="source-path">${esc(r.path)}</span></button>`).join('')}${!sources.length&&!fs.length?'<p class="empty">이번 분석의 근거 색인에서 찾지 못했습니다. 다른 기능명·함수·파일명을 입력하세요.</p>':''}`;
}
$('nav').innerHTML=views.map(([id,label])=>`<button class="navbtn" data-view="${id}" aria-controls="view-${id}" aria-pressed="${id==='overview'}">${label}</button>`).join('');
overview();architecture();execution();features();security();decisions();
document.addEventListener('click',e=>{
 const el=e.target.closest('button,[data-diagram-node]');if(!el)return;
 if(el.id==='show-baseline'){baseline();return}if(el.id==='close-dialog'){closeDialog();return}
 if(el.id==='textsize'){const large=document.body.classList.toggle('large-text');el.setAttribute('aria-pressed',String(large));el.textContent=large?'기본 글씨':'글씨 크게';return}
 if(el.dataset.evidence){openEvidence(el.dataset.evidence.split(','),el);return}
 if(el.dataset.view){navigate(el.dataset.view);return}
 if(el.dataset.flow!==undefined){S.flow=Number(el.dataset.flow);S.step=0;S.error=false;execution();navigate('execution');return}
 if(el.dataset.node){S.node=el.dataset.node;S.archTab='structure';architecture();navigate('architecture');return}
 if(el.dataset.diagramNode){S.node=el.dataset.diagramNode;architecture();return}
 if(el.dataset.mode){S.mode=el.dataset.mode;if(S.mode==='as-is'&&S.node==='admin')S.node='api';architecture();return}
 if(el.dataset.archtab){S.archTab=el.dataset.archtab;architecture();return}
 if(el.dataset.step!==undefined){S.step=Number(el.dataset.step);execution();return}
 if(el.id==='previous'||el.id==='next'){S.step+=el.id==='next'?1:-1;execution();return}
 if(el.dataset.tag){S.tags=S.tags.includes(el.dataset.tag)?S.tags.filter(t=>t!==el.dataset.tag):[...S.tags,el.dataset.tag];execution();return}
 if(el.dataset.state){$('state-detail').textContent=({draft:'편집은 revision을 증가시킵니다. 기존 확정본은 별도로 남고 미확정 변경을 표시합니다.',confirmed:'확정 version이 추천·자격·지원서 근거가 됩니다. 재확정하면 기존 지원서는 자동 덮어쓰기 대신 재검토가 필요합니다.',approved:'지원서를 편집하면 승인 시각을 비웁니다. 현재 프로필·공고를 다시 검사한 뒤 사용자가 재승인합니다.',deleted:'삭제 요청을 먼저 영속화하고 DB 밖 이력을 남깁니다. 세션·임시 자료 폐기와 SQL 삭제 후, 복원 시 최신 삭제 이력을 재적용합니다.'})[el.dataset.state];return}
 if(el.dataset.decision){const id=el.dataset.decision;S.decision=S.decision===id?'':id;decisions();if(S.decision)$('decision-'+id).scrollIntoView({block:'start',behavior:'instant'});return}
 if(el.dataset.choice){const [id,n]=el.dataset.choice.split(':');S.choices[id]=Number(n);decisions();return}
 if(el.id==='close-search'){$('search').value='';$('searchresults').hidden=true;return}
 if(el.dataset.featureResult){S.feature='전체';S.featureOpen=el.dataset.featureResult;features();$('searchresults').hidden=true;navigate('features');$('feature-'+S.featureOpen).scrollIntoView({block:'start',behavior:'instant'});return}
});
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el||el.dataset.view||el.dataset.node||el.dataset.featureResult||el.dataset.evidence||['show-baseline','close-dialog'].includes(el.id))return;const key=Object.keys(el.dataset)[0],id=el.id;queueMicrotask(()=>{const next=id?$(id):Array.from(document.querySelectorAll('button')).find(n=>key&&n.dataset[key]===el.dataset[key]);if(next&&!next.disabled)next.focus({preventScroll:true})})},true);
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(!$('dialog-shell').hidden)closeDialog();else $('searchresults').hidden=true}
 if(!$('dialog-shell').hidden&&e.key==='Tab'){const controls=Array.from($('reader-dialog').querySelectorAll('button,a,summary,input,select')).filter(n=>!n.closest('[hidden]'));const first=controls[0],last=controls[controls.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}
});
$('dialog-shell').addEventListener('click',e=>{if(e.target===$('dialog-shell'))closeDialog()});
document.addEventListener('change',e=>{if(e.target.id==='scenario'){S.flow=Number(e.target.value);S.step=0;S.error=false;execution()}if(e.target.id==='error-toggle'){S.error=e.target.checked;execution()}if(e.target.id==='status-filter'){S.feature=e.target.value;features()}if(e.target.id==='security-select')securityItems(e.target.value)});
$('search').addEventListener('input',renderSearch);$('searchform').addEventListener('submit',e=>{e.preventDefault();renderSearch()});
function openFragment(){const fragment=location.hash.slice(1);if(fragment.startsWith('source=')){const key=fragment.slice(7);navigate('overview',false);if(D.sources[key])openEvidence([key],$('workspace'))}else navigate(fragment||'overview',false)}
window.addEventListener('hashchange',openFragment);openFragment();
</script>
</body>
</html>
