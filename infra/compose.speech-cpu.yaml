name: reconnect-speech-cpu

services:
  speech:
    image: reconnect-speech-cpu:local
    platform: linux/amd64
    build:
      context: ../speech
      target: runtime
    user: "10001:10001"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    stop_grace_period: 10s
    cpus: 2.0
    mem_limit: 8g
    memswap_limit: 8g
    pids_limit: 128
    shm_size: 64m
    networks: [speech]
    volumes:
      - type: bind
        source: ../speech/models
        target: /app/models
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    logging:
      driver: none

networks:
  speech:
    internal: true
